<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · Amend</title><meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0a0d13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css"><script src="/static/app.js"></script><script src="/static/shell.js"></script>
<script src="/static/chat.js"></script><script src="/static/studio-pages.js"></script>
</head><body class="studio">
<main class="wrap" id="view"></main>
<script>
let ME = null, dirty = false;
const DAYS = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"];
const TABS = { "": ["home", "Home"], inbox: ["inbox", "Inbox"], deals: ["deals", "Deals"], calendar: ["calendar", "Calendar"],
  earnings: ["earnings", "Earnings"], ledger: ["earnings", "Ledger"], prices: ["prices", "Price list"], profile: ["profile", "Profile & media kit"],
  brands: ["brands", "Brands"], settings: ["settings", "Settings"] };

function go(path) { if (dirty && !confirm("Discard changes?")) return; dirty = false; history.pushState({}, "", path); route(); }
window.onpopstate = route;
window.onbeforeunload = () => dirty ? "unsaved" : undefined;
const isStudioPage = href => /^\/studio(\/(inbox|deals|calendar|earnings|ledger|prices|profile|brands|settings))?$/.test(href);
Shell.mount("creator", "home", { onNavigate: href => { if (isStudioPage(href)) { go(href); return true; } return false; } });
function refreshBadge() { Shell.refreshBadge(); }
function badge(n) { Shell.setBadge(n); }

async function route() {
  const seg = location.pathname.split("/")[2] || "";
  const [tab, title] = TABS[seg] || TABS[""];
  Shell.setActive(tab, title);
  document.body.classList.toggle("inbox-full", tab === "inbox");  // the Inbox fills the screen under the top bar
  document.title = `${title} · Amend`;
  $("#view").innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  try {
    if (!ME) { ME = await api("/api/me"); Shell.setName(ME.display_name.split(" ")[0]); }
    if (tab !== "inbox") refreshBadge();
    const page = { home: () => window.homeTab ? homeTab() : inboxTab(), inbox: () => window.inboxSplit ? inboxSplit() : inboxTab(), deals: () => window.dealsBoard ? dealsBoard() : deals(), prices: () => window.pricesPlus ? pricesPlus() : prices(), profile: () => window.profilePlus ? profilePlus() : profile(),
      earnings: () => window.earningsTab ? earningsTab(seg === "ledger") : ledger(), calendar: () => window.calendarTab ? calendarTab() : soon("Calendar"),
      brands: () => window.brandsTab ? brandsTab() : soon("Brands"), settings: () => window.settingsTab ? settingsTab() : soon("Settings") }[tab];
    await page();
  } catch (e) {
    if (e.status === 401) { location.href = "/login"; return; }
    $("#view").innerHTML = `<div class="empty">${icon("triangle-alert", "big")}<p>${esc(e.message)}</p><button class="btn" onclick="route()">${icon("rotate-cw")} Try again</button></div>`;
  }
}
function soon(name) { $("#view").innerHTML = `<div class="empty">${icon("hammer", "big")}<h2>${esc(name)} is coming soon</h2><p class="muted">It's being built.</p><a class="btn" href="/studio">Back to Home</a></div>`; }

/* ---------- Ledger tab (AG Grid) ---------- */
function loadGrid() {
  if (window.agGrid) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/ag-grid-community@32.2.0/dist/ag-grid-community.min.js";
    s.onload = res; s.onerror = () => rej(new Error("The ledger grid couldn't load. Check your connection."));
    document.head.appendChild(s);
  });
}
async function ledger() {
  const r = await api("/api/studio/ledger");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  $("#view").innerHTML = `<div class="row between wrapx" style="gap:8px"><h1>Ledger</h1>
   <div class="row" style="gap:8px"><input id="lg-q" placeholder="Filter" style="max-width:200px"><button class="btn small" id="lg-csv">Export CSV</button></div></div>
    <p class="muted small">Every payment with the words behind it. PayPal fees so far: <b>$${r.fees_usd.toFixed(2)}</b>, a platform cost Amend pays (never taken from you). Tap a row for its money story.</p>
    ${r.rows.length ? `<div id="grid" class="ag-wrap ${dark ? "ag-theme-quartz-dark" : "ag-theme-quartz"}"></div>`
      : `<div class="empty"><div class="ic"><i data-lucide='book-open' aria-hidden='true'></i></div>No payments yet. They appear here once a brand holds money.</div>`}`;
  if (!r.rows.length) return;
  await loadGrid();
  const money = p => p.value == null ? "" : "$" + Number(p.value).toFixed(2);
  const grid = agGrid.createGrid($("#grid"), {
    rowData: r.rows, pagination: true, paginationPageSize: 50, paginationPageSizeSelector: [20, 50, 100],
    defaultColDef: { sortable: true, filter: true, resizable: true },
    columnDefs: [
      { field: "date", width: 110 }, { field: "brand", width: 150 }, { field: "item", flex: 1, minWidth: 160 }, { field: "kind", width: 100 },
      { field: "amount_usd", headerName: "Amount", valueFormatter: money, width: 110 }, { field: "aed", headerName: "AED", width: 100 },
      { field: "status", width: 110 }, { field: "paypal_id", headerName: "PayPal ID", width: 160 },
      { field: "quote", headerName: "<i data-lucide='quote' aria-hidden='true'></i> Quote", flex: 1, minWidth: 180, tooltipField: "quote" }, { field: "version", width: 90 },
      { field: "request_id", headerName: "Request ID", hide: true },
      { field: "updated", width: 170, hide: true }],
    onRowClicked: e => { location.href = `/story/${e.data.deal}`; },
  });
  $("#lg-q").oninput = e => grid.setGridOption("quickFilterText", e.target.value);
  $("#lg-csv").onclick = () => grid.exportDataAsCsv({ fileName: "amend-ledger.csv" });
}

/* ---------- Inbox tab (D4) ---------- */
let IF = { filter: "all", page: 0 };
async function inboxTab(append = false) {
  const r = await api(`/api/studio/inbox?filter=${IF.filter}&page=${IF.page}`);
  badge(r.unread);
  const rows = r.items.map(x => `
    <a class="inbox-row ${x.unread ? "unread" : ""}" href="/studio/deals/${x.deal}" data-ev="${x.event_id}">
      <span class="ic">${icon(x.icon)}</span>
      <div class="grow"><div class="row between"><b>${esc(x.brand)}</b><span class="tiny muted">${ago(x.at)}</span></div>
        <div class="small">${esc(x.line)}</div></div>
   ${x.unread ? '<span class="udot" aria-label="unread"></span>' : ""}
    </a>`).join("");
  if (append) { $("#ib-list").insertAdjacentHTML("beforeend", rows); }
  else {
    const c = r.counts || {};
    $("#view").innerHTML = `
      <div class="row between"><h1>Inbox</h1>${r.unread ? `<button class="btn small" id="allread">Mark all read</button>` : ""}</div>
      <p class="muted small">Messages, changes waiting for you, delivery gaps and PayPal updates, newest first.</p>
      <div class="chips" style="margin:12px 0">${[["all", "All"], ["needs_me", "Needs me"], ["messages", "Messages"], ["money", "Money"]]
        .map(([k, t]) => `<button data-f="${k}" class="${IF.filter === k ? "on" : ""}">${t}${k === "needs_me" && c.needs_me ? `<span class="dot">${c.needs_me}</span>` : ""}</button>`).join("")}</div>
      <div id="ib-list" class="card" style="padding:6px">${rows}</div>
      ${!r.items.length ? `<div class="empty"><div class="ic"><i data-lucide='inbox' aria-hidden='true'></i></div>Nothing new. Messages, changes and PayPal updates show up here.</div>` : ""}
      <div id="ib-more"></div>`;
    if (!r.items.length) $("#ib-list").hidden = true;
    $$(".chips button").forEach(b => b.onclick = () => { IF = { filter: b.dataset.f, page: 0 }; inboxTab(); });
    if ($("#allread")) $("#allread").onclick = e => busy(e.currentTarget, async () => {
      const ids = $$("#ib-list .inbox-row.unread").map(a => +a.dataset.ev);
      await api("/api/studio/inbox/read", { body: { event_ids: ids } }); inboxTab();
    });
  }
  $$("#ib-list .inbox-row").forEach(a => a.onclick = async e => {
    e.preventDefault();
    try { await api("/api/studio/inbox/read", { body: { event_ids: [+a.dataset.ev] } }); } catch {}
    location.href = a.getAttribute("href");
  });
  $("#ib-more").innerHTML = r.more ? `<button class="btn block" id="ib-lm">Load more</button>` : "";
  if (r.more) $("#ib-lm").onclick = () => { IF.page++; inboxTab(true); };
}

/* ---------- Deals tab (3.4) ---------- */
let F = { filter: "all", q: "", page: 0 };
async function deals(append = false) {
  const r = await api(`/api/studio/deals?filter=${F.filter}&q=${encodeURIComponent(F.q)}&page=${F.page}`);
  const c = r.counts;
  const html = r.deals.map(d => `
    <a class="card dealcard" href="/studio/deals/${d.id}">
      <div class="row">
        <div class="avatar">${initials(d.brand)}</div>
        <div class="grow"><div class="row between"><b>${esc(d.brand)}</b><span>${d.total_cents ? usd(d.total_cents) : ""}</span></div>
        <div class="row wrapx" style="margin-top:4px">${dealPill(d.status)} ${moneyPill(d.money)} ${d.needs_me ? '<span class="pill waiting">Needs you</span>' : ""}</div>
        <div class="tiny muted" style="margin-top:6px">${d.last ? esc(lastLine(d.last)) + " · " + ago(d.last.at) : ""}</div></div>
      </div>
    </a>`).join("");
  if (append) { $("#deal-list").insertAdjacentHTML("beforeend", html); }
  else {
    $("#view").innerHTML = `
      <h1>Hi ${esc(ME.display_name.split(" ")[0])} </h1>
      <p class="muted">${c.all} deal${c.all === 1 ? "" : "s"} · ${usd(r.held_cents)} held · ${c.needs_me} waiting for you</p>
      <div class="chips" style="margin:12px 0">
        ${[["all", "All"], ["needs_me", "Needs me"], ["waiting", "Waiting for brand"], ["held", "Held"], ["done", "Done"], ["cancelled", "Cancelled"]]
          .map(([k, t]) => `<button data-f="${k}" class="${F.filter === k ? "on" : ""}">${t}${k === "needs_me" && c.needs_me ? `<span class="dot">${c.needs_me}</span>` : ""}</button>`).join("")}
      </div>
   <input id="q" placeholder="Search by brand or deal number" value="${esc(F.q)}">
      <div id="deal-list" class="stack" style="margin-top:12px">${html}</div>
      ${!r.deals.length ? (c.all ? `<div class="empty">No deals match.</div>` :
        `<div class="empty"><div class="ic"><i data-lucide='link' aria-hidden='true'></i></div>No deals yet. Send a brand your deal link.<br><br><button class="btn primary" onclick="newDeal()">+ New deal link</button></div>`) : ""}
      <div id="more"></div>
      <button class="btn primary fab" onclick="newDeal()">+ New deal link</button>`;
    $$(".chips button").forEach(b => b.onclick = () => { F.filter = b.dataset.f; F.page = 0; deals(); });
    let t; $("#q").oninput = e => { clearTimeout(t); t = setTimeout(() => { F.q = e.target.value; F.page = 0; deals().then(() => { $("#q").focus(); }); }, 300); };
  }
  $("#more").innerHTML = r.more ? `<button class="btn block" id="lm">Load more</button>` : "";
  if (r.more) $("#lm").onclick = () => { F.page++; deals(true); };
}
function lastLine(e) {
  return ({ "deal.created": "Link made", "link.created": "Link made", "link.opened": "Brand opened the link", "brief.submitted": "Brand sent a brief",
    "brief.edited": "Brand edited the brief", "deal.drafted": "Offer ready", "deal.accepted": "You accepted", "money.status": "Money updated",
    "deal.status": "Status changed", "paypal.called": "PayPal updated", "paypal.returned": "Brand came back from PayPal",
    "term.price_edited": "Price edited", "deal.declined": "Declined", "money.planned": "Hold planned", "approval.recorded": "Brand approved the hold",
    "money.approved": "Hold approved" })[e.type] || e.type;
}

function newDeal() {
  const sh = sheet(`<h2>New deal link</h2>
    <form id="nd">
   <label>Brand name *</label><input name="brand_org" required maxlength="80" placeholder="Dune Roast Coffee">
   <label>Contact name *</label><input name="contact_name" required maxlength="60" placeholder="Nadia">
   <label>Contact email (optional)</label><input name="contact_email" type="email" maxlength="120" placeholder="for notifications later">
      <label>Link valid for</label>
      <select name="days"><option value="7">7 days</option><option value="14" selected>14 days</option><option value="30">30 days</option></select>
      <div class="err" id="nd-err" hidden></div>
      <button class="btn primary block" style="margin-top:16px" id="nd-go">Create link</button>
    </form>`);
  $("#nd", sh).onsubmit = e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target)); fd.days = +fd.days;
    busy($("#nd-go"), async () => {
      try {
        const r = await api("/api/deals", { body: fd });
        linkReady(r.link, fd.contact_name);
        F = { filter: "all", q: "", page: 0 }; deals();
   } catch (err) { $("#nd-err").textContent = err.message; $("#nd-err").hidden = false; }
    });
  };
}
function linkReady(link, who) {
  sheet(`<h2>Link ready for ${esc(who)}</h2>
    <p class="muted small">This link is only for ${esc(who)}. Amend uses it to know who said what.</p>
    <input readonly value="${esc(link)}" id="lk" onclick="this.select()">
    <div class="stack" style="margin-top:12px">
      <button class="btn primary block" id="cp">Copy link</button>
      ${navigator.share ? `<button class="btn block" id="sh">Share…</button>` : ""}
      <button class="btn block" onclick="closeSheet()">Done</button>
    </div>`);
 $("#cp").onclick = async () => { try { await navigator.clipboard.writeText(link); toast("Copied"); } catch { $("#lk").select(); document.execCommand("copy"); toast("Copied"); } };
  if (navigator.share) $("#sh").onclick = () => navigator.share({ title: "Our deal on Amend", text: "Let's do it here, the money's protected for both of us.", url: link }).catch(() => {});
}

/* ---------- Prices tab (3.5) ---------- */
let ITEMS = [];
async function prices() {
  ITEMS = (await api("/api/studio/prices")).items;
  const L = ME.limits || {};
  const rows = ITEMS.map(p => `
    <div class="line" style="${p.active ? "" : "opacity:.45"}">
      <div class="grow"><b>${esc(p.name)}</b> ${p.hidden ? '<span class="pill">Hidden</span>' : ""} ${p.active ? "" : '<span class="pill">Retired</span>'}
        <div class="small muted">${priceText(p)} · ${esc(p.kind)}${p.rules && p.rules.note ? " · " + esc(p.rules.note) : ""}</div></div>
      <button class="btn small" data-menu="${p.id}">⋯</button>
    </div>`).join("");
  $("#view").innerHTML = `
    <section class="card"><div class="row between"><h2>Price list</h2><button class="btn small primary" onclick="editItem()">+ Add item</button></div>
      <div class="list">${rows || `<div class="empty">No prices yet. Add your first item.</div>`}</div></section>
    <section class="card" style="margin-top:14px"><h2>My limits</h2>
      <p class="small muted">The AI and every change card check these and flag conflicts.</p>
      <label>Minimum Reel price ($)</label><input id="minreel" type="number" min="0" step="1" value="${(L.min_reel_cents || 0) / 100}">
      <label>Posting days</label><div class="daypick" id="days">${DAYS.map(d => `<button type="button" data-d="${d}" class="${(L.posting_days || []).includes(d) ? "on" : ""}">${d[0].toUpperCase() + d.slice(1)}</button>`).join("")}</div>
      <div class="hint">Days switched off can't be posting days (e.g. Sat and Sun off = no weekend posting).</div>
   <label>Banned claims</label><div id="claims"></div><input id="claim" placeholder="Type a claim and press Enter">
      <label>Minimum notice for date changes (hours)</label><input id="notice" type="number" min="0" value="${L.min_notice_hours || 48}">
      <button class="btn primary block" id="sv-lim" style="margin-top:14px">Save limits</button></section>
    <section class="card" style="margin-top:14px"><h2>UAE Advertiser Permit</h2>
   <label>Permit number</label><input id="pno" value="${esc(ME.permit_no || "")}" placeholder="AP-20260142">
      <label>Expiry date</label><input id="pexp" type="date" value="${esc(ME.permit_expiry || "")}">
      <div id="pbadge" style="margin-top:10px">${permitBadge(ME.permit)}</div>
      <p class="hint">Format and expiry check only. Not verified with the UAE Media Council.</p>
      <button class="btn primary block" id="sv-permit">Save and check format</button></section>`;
  $$("[data-menu]").forEach(b => b.onclick = () => itemMenu(ITEMS.find(x => x.id === b.dataset.menu)));
  let claims = [...(L.banned_claims || [])];
 const drawClaims = () => $("#claims").innerHTML = claims.map((c, i) => `<span class="tag">${esc(c)}<button data-i="${i}" aria-label="Remove">×</button></span>`).join("");
  drawClaims();
  $("#claims").onclick = e => { if (e.target.dataset.i) { claims.splice(+e.target.dataset.i, 1); dirty = true; drawClaims(); } };
  $("#claim").onkeydown = e => { if (e.key === "Enter" && e.target.value.trim()) { e.preventDefault(); claims.push(e.target.value.trim()); e.target.value = ""; dirty = true; drawClaims(); } };
  $$("#days button").forEach(b => b.onclick = () => { b.classList.toggle("on"); dirty = true; });
  ["#minreel", "#notice", "#pno", "#pexp"].forEach(s => $(s).oninput = () => dirty = true);
  $("#sv-lim").onclick = e => busy(e.currentTarget, async () => {
    try {
      ME.limits = await api("/api/studio/limits", { method: "PUT", body: { min_reel_cents: Math.round(+$("#minreel").value * 100),
        posting_days: $$("#days button.on").map(b => b.dataset.d), banned_claims: claims, min_notice_hours: +$("#notice").value } });
   dirty = false; toast("Limits saved");
  } catch (err) { toast(err.message, "bad"); }
  });
  $("#sv-permit").onclick = e => busy(e.currentTarget, async () => {
    try {
      const r = await api("/api/studio/permit", { method: "PUT", body: { permit_no: $("#pno").value, permit_expiry: $("#pexp").value || null } });
   ME.permit = r; ME.permit_no = $("#pno").value; ME.permit_expiry = $("#pexp").value; $("#pbadge").innerHTML = permitBadge(r); dirty = false; toast("Permit saved");
  } catch (err) { toast(err.message, "bad"); }
  });
}
function priceText(p) {
  if (p.standard_cents == null) return "Rule";
  const u = { month: " / month", change: " per change", revision: " each" }[p.unit] || "";
  if (p.min_cents != null && p.max_cents != null && p.min_cents !== p.max_cents)
    return `${usd(p.min_cents)}–${usd(p.max_cents).slice(1)} · standard ${usd(p.standard_cents)}${u}`;
  return usd(p.standard_cents) + u;
}
function permitBadge(p) {
  const ic = { ok: "<i data-lucide='circle-check' aria-hidden='true'></i>", soon: "<i data-lucide='triangle-alert' aria-hidden='true'></i>", expired: "<i data-lucide='circle-x' aria-hidden='true'></i>", bad_format: "<i data-lucide='circle-x' aria-hidden='true'></i>", missing: "<i data-lucide='minus' aria-hidden='true'></i>", no_expiry: "<i data-lucide='triangle-alert' aria-hidden='true'></i>" }[p.state] || "";
  return `<span class="pill ${p.state === "ok" ? "collected" : p.state === "soon" || p.state === "no_expiry" ? "waiting" : "failed"}">${ic} ${esc(p.label)}</span>`;
}
function itemMenu(p) {
  sheet(`<h3>${esc(p.name)}</h3><div class="stack">
    <button class="btn block" id="m-edit">Edit</button>
    <button class="btn block" id="m-hide">${p.hidden ? "Show again" : "Hide from brands"}</button>
    <button class="btn danger block" id="m-retire">${p.active ? "Retire" : "Bring back"}</button>
    <p class="hint">Retire, not delete: old deals still point to this item, so it's kept.</p></div>`);
  $("#m-edit").onclick = () => editItem(p);
 $("#m-hide").onclick = e => busy(e.currentTarget, async () => { await api("/api/studio/prices", { body: { ...p, hidden: !p.hidden } }); closeSheet(); toast("Saved"); prices(); });
 $("#m-retire").onclick = e => busy(e.currentTarget, async () => { await api(`/api/studio/prices/${p.id}/retire`, { body: { active: !p.active } }); closeSheet(); toast(p.active ? "Retired" : "Back on the list"); prices(); });
}
function editItem(p = { name: "", kind: "deliverable", unit: "item", rules: {} }) {
  const c = v => v == null ? "" : v / 100;
  const sh = sheet(`<h2>${p.id ? "Edit item" : "Add item"}</h2><form id="it">
    <label>Name *</label><input name="name" required maxlength="80" value="${esc(p.name)}">
    <label>Type</label><select name="kind">${["deliverable", "extra", "package", "rule"].map(k => `<option ${p.kind === k ? "selected" : ""} value="${k}">${k[0].toUpperCase() + k.slice(1)}</option>`).join("")}</select>
    <div class="row"><div class="grow"><label>Minimum $</label><input name="min" type="number" min="0" step="1" value="${c(p.min_cents)}"></div>
      <div class="grow"><label>Maximum $</label><input name="max" type="number" min="0" step="1" value="${c(p.max_cents)}"></div></div>
    <label>Standard $ (the price the AI uses)</label><input name="std" type="number" min="0" step="1" value="${c(p.standard_cents)}">
    <label>Unit</label><select name="unit">${[["item", "Per item"], ["month", "Per month"], ["change", "Per change"], ["revision", "Per revision"]].map(([k, t]) => `<option ${p.unit === k ? "selected" : ""} value="${k}">${t}</option>`).join("")}</select>
    <label>Included revisions</label><input name="rev" type="number" min="0" max="10" value="${(p.rules || {}).included_revisions ?? ""}">
    <label>Notes</label><input name="note" maxlength="140" value="${esc((p.rules || {}).note || "")}">
    <label>Package includes (for packages: e.g. reel=1, story_set=3)</label><input name="includes" maxlength="200" value="${esc(Object.entries((p.rules || {}).includes || {}).map(([k, v]) => k + "=" + v).join(", "))}">
    <div class="err" id="it-err" hidden></div>
    <button class="btn primary block" id="it-go" style="margin-top:16px">Save item</button></form>`);
  $("#it", sh).onsubmit = e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    const cents = v => v === "" ? null : Math.round(+v * 100);
    const rules = { ...(p.rules || {}) };
    if (f.rev !== "") rules.included_revisions = +f.rev; else delete rules.included_revisions;
    if (f.note) rules.note = f.note; else delete rules.note;
    if (f.kind === "package") rules.includes = Object.fromEntries(f.includes.split(",").map(x => x.trim().split("=")).filter(x => x.length === 2 && +x[1] > 0).map(([k, v]) => [k.trim(), +v]));
    else delete rules.includes;
    const body = { id: p.id, name: f.name, kind: f.kind, unit: f.unit, min_cents: cents(f.min), max_cents: cents(f.max), standard_cents: cents(f.std), rules, hidden: !!p.hidden };
    const err = (body.min_cents != null && body.max_cents != null && body.min_cents > body.max_cents) ? "Minimum is above maximum"
      : (body.standard_cents != null && ((body.min_cents != null && body.standard_cents < body.min_cents) || (body.max_cents != null && body.standard_cents > body.max_cents))) ? "Standard must be between minimum and maximum" : "";
  if (err) { $("#it-err").textContent = err; $("#it-err").hidden = false; return; }
    busy($("#it-go"), async () => {
   try { await api("/api/studio/prices", { body }); closeSheet(); toast("Item saved"); prices(); }
   catch (er) { $("#it-err").textContent = er.message; $("#it-err").hidden = false; }
    });
  };
}

/* ---------- Profile tab (3.6, minimum) ---------- */
async function profile() {
  const P = await api("/api/studio/profile");
  const m = (P.metrics || [])[0] || { platform: "instagram", audience: {} };
  const chipsSel = (name, all, have) => `<div class="chips" style="flex-wrap:wrap">${all.map(x => `<button type="button" data-${name}="${esc(x)}" class="${have.includes(x) ? "on" : ""}">${esc(x)}</button>`).join("")}</div>`;
  const pctTxt = o => Object.entries(o || {}).map(([k, v]) => `${k}=${v}`).join(", ");
  $("#view").innerHTML = `
    <div class="card"><div class="row"><div class="avatar lg">${initials(P.display_name)}</div>
      <div><h2>${esc(P.display_name)}</h2><div class="muted">@${esc(P.handle)}</div></div></div>
      ${ME.paypal_email_masked ? `<p class="small">PayPal: ${esc(ME.paypal_email_masked)}</p>` : ""}
      <p class="hint">Brands never see your phone, email or address. They contact you through Amend.</p></div>
    <form id="pf" class="card" style="margin-top:14px"><h2>Profile</h2>
      <label>Display name</label><input name="display_name" maxlength="80" value="${esc(P.display_name)}">
      <label>Bio (160 characters)</label><textarea name="bio" maxlength="160" style="min-height:70px">${esc(P.bio || "")}</textarea>
      <div class="row"><div class="grow"><label>City</label><input name="city" maxlength="40" value="${esc(P.city || "")}"></div>
        <div class="grow"><label>Country</label><input name="country" maxlength="40" value="${esc(P.country || "")}"></div></div>
      <label>Niches</label>${chipsSel("niche", P.all_niches, P.niches)}
      <label>Content styles</label>${chipsSel("style", P.all_styles, P.styles)}
      <label>Languages (comma separated)</label><input name="languages" value="${esc(P.languages.join(", "))}">
      <div class="row"><div class="grow"><label>Days to first draft</label><input name="turnaround_days" type="number" min="0" max="90" value="${P.turnaround_days ?? ""}"></div>
        <div class="grow"><label>Next available</label><input name="next_available" type="date" value="${esc(P.next_available || "")}"></div></div>
      <label>Past brands (comma separated, shown as self-reported)</label><input name="past_brands" value="${esc((P.past_brands || []).join(", "))}">
      <label>Search keywords</label><input name="keywords" maxlength="200" value="${esc(P.keywords || "")}">
      <button class="btn primary block" id="pf-go" style="margin-top:14px">Save profile</button></form>
    <form id="mf" class="card" style="margin-top:14px"><div class="row between"><h2 style="margin:0">Reach and audience</h2>
        <button type="button" class="btn small" id="fill"><i data-lucide='camera' aria-hidden='true'></i> Fill from screenshot</button></div>
      <p class="hint">Engagement and view rate are worked out by Amend from these numbers. Numbers read from a screenshot are marked "from insights screenshot", never "verified".</p>
      <input type="file" id="shot" accept="image/png,image/jpeg,image/webp" hidden>
      <div id="mf-src" class="small muted"></div>
      <label>Platform</label><select name="platform">${["instagram", "tiktok", "youtube"].map(p => `<option ${m.platform === p ? "selected" : ""}>${p}</option>`).join("")}</select>
      <div class="row"><div class="grow"><label>Followers</label><input name="followers" type="number" min="1" required value="${m.followers ?? ""}"></div>
        <div class="grow"><label>Avg views (last 12)</label><input name="avg_views" type="number" min="0" value="${m.avg_views ?? ""}"></div></div>
      <div class="row"><div class="grow"><label>Avg likes</label><input name="avg_likes" type="number" min="0" value="${m.avg_likes ?? ""}"></div>
        <div class="grow"><label>Avg comments</label><input name="avg_comments" type="number" min="0" value="${m.avg_comments ?? ""}"></div></div>
      <label>Posts per week</label><input name="posts_per_week" type="number" min="0" value="${m.posts_per_week ?? ""}">
   <label>Audience countries (%)</label><input name="countries" placeholder="UAE=60, KSA=20" value="${esc(pctTxt(m.audience.countries))}">
   <label>Gender (%)</label><input name="gender" placeholder="female=65, male=35" value="${esc(pctTxt(m.audience.gender))}">
   <label>Ages (%)</label><input name="ages" placeholder="18-24=30, 25-34=45" value="${esc(pctTxt(m.audience.ages))}">
      <div class="err" id="mf-err" hidden></div>
      <button class="btn primary block" id="mf-go" style="margin-top:14px">Save numbers</button></form>
    <div class="stack" style="margin-top:14px">
      <a class="btn block" href="/c/${esc(P.handle)}">Preview my public page</a>
      <button class="btn block" id="cpb">Copy my booking link</button>
      <button class="btn danger block" onclick="signOut()">Sign out</button></div>`;
  let source = "self_reported";
  $$("[data-niche],[data-style]").forEach(b => b.onclick = () => b.classList.toggle("on"));
  const list = v => v.split(",").map(x => x.trim()).filter(Boolean);
  const pct = v => Object.fromEntries(list(v).map(x => x.split("=")).filter(p => p.length === 2 && !isNaN(+p[1])).map(([k, n]) => [k.trim(), +n]));
  $("#pf").onsubmit = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    busy($("#pf-go"), async () => { try {
      await api("/api/studio/profile", { method: "PUT", body: { ...f, turnaround_days: f.turnaround_days === "" ? null : +f.turnaround_days, next_available: f.next_available || null,
        languages: list(f.languages), past_brands: list(f.past_brands), niches: $$("[data-niche].on").map(b => b.dataset.niche), styles: $$("[data-style].on").map(b => b.dataset.style) } });
   toast("Profile saved"); } catch (er) { toast(er.message, "bad"); } }); };
  $("#mf").onsubmit = e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const n = k => f[k] === "" ? null : Math.round(+f[k]);
    busy($("#mf-go"), async () => { $("#mf-err").hidden = true; try {
      await api("/api/studio/metrics", { body: { platform: f.platform, followers: n("followers"), avg_views: n("avg_views"), avg_likes: n("avg_likes"), avg_comments: n("avg_comments"),
        posts_per_week: n("posts_per_week"), audience: { countries: pct(f.countries), gender: pct(f.gender), ages: pct(f.ages) }, source } });
   toast(source === "insights_screenshot" ? "Saved · marked as read from a screenshot" : "Numbers saved"); profile();
  } catch (er) { $("#mf-err").textContent = er.message; $("#mf-err").hidden = false; } }); };
  $("#fill").onclick = () => $("#shot").click();
  $("#shot").onchange = async () => {
    const file = $("#shot").files[0]; if (!file) return;
  if (file.size > 2_000_000) { toast("Screenshot too big (2 MB max)", "bad"); return; }
    const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(file); });
    await busy($("#fill"), async () => { try {
      const r = (await api("/api/studio/metrics/read", { body: { mime: file.type, data_b64: data } })).read;
      const set = (k, v) => { if (v != null) $(`#mf [name=${k}]`).value = v; };
      if (r.platform) $("#mf [name=platform]").value = r.platform;
      ["followers", "avg_views", "avg_likes", "avg_comments"].forEach(k => set(k, r[k]));
      set("countries", pctTxt(r.audience.countries) || null); set("gender", pctTxt(r.audience.gender) || null); set("ages", pctTxt(r.audience.ages) || null);
      source = "insights_screenshot";
      $("#mf-src").innerHTML = `<div class="banner gold">Read from your screenshot. <b>Check every number</b>, then save. It will show as "from insights screenshot".</div>`;
  } catch (er) { toast(er.message, "bad"); } });
  };
 $("#cpb").onclick = async () => { const u = location.origin + "/c/" + P.handle; try { await navigator.clipboard.writeText(u); } catch {} toast("Booking link copied"); };
}
route();
</script>
</body></html>
