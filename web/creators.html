<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find creators · Amend</title>
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0a0d13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css"><script src="/static/app.js"></script><script src="/static/shell.js"></script>
</head><body class="browse">
<header class="top"><a class="logo" href="/">Amend</a><span class="title" id="ttl">Find creators</span><span class="auth-slot"></span></header>
<div class="browse-grid wrap">
 <aside id="filters-side" class="filters-side" aria-label="Filters"></aside>
  <main id="view"></main>
</div>
<div id="cmpbar" class="cmpbar" hidden></div>
<script>
const COMPARE = location.pathname === "/creators/compare";
const NICHES = ["food", "coffee", "beauty", "fashion", "fitness", "family", "tech", "travel", "automotive", "real estate", "gaming", "home", "pets", "finance", "comedy"];
const LS = "amend.shortlist";
let Q = Object.fromEntries(new URLSearchParams(location.search)), PAGE = 0, SHORT = new Set(), CMP = new Set();

function fmtN(n) { return n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n); }
const SRC = { verified: ["Verified", "collected"], instagram_read: ["Instagram read", "collected"], instagram_public: ["From Instagram, confirmed by creator", "held"], insights_screenshot: ["From insights screenshot", "held"], demo: ["Demo data", "planned"], self_reported: ["Self-reported", "waiting"] };
function srcBadge(s) { if (!s) return ""; const [t, c] = SRC[s] || [s, ""]; return `<span class="pill ${c}" title="Where these numbers come from">${t}</span>`; }

async function loadShort() {
  await new Promise(r => setTimeout(r, 0));
  if (window.WHO === undefined) await fillAuthSlots();
  if (WHO && WHO.kind === "brand") { try { SHORT = new Set((await api("/api/brand/shortlist")).items.map(i => i.creator_id)); return; } catch {} }
  try { SHORT = new Set(JSON.parse(localStorage.getItem(LS) || "[]")); } catch { SHORT = new Set(); }
}
async function toggleShort(id, btn) {
  const on = !SHORT.has(id);
  if (WHO && WHO.kind === "brand") { await api("/api/brand/shortlist", { body: { creator_id: id, on } }); }
  on ? SHORT.add(id) : SHORT.delete(id);
  if (!(WHO && WHO.kind === "brand")) { try { localStorage.setItem(LS, JSON.stringify([...SHORT])); } catch {} }
 btn.innerHTML = "<i data-lucide='heart' aria-hidden='true'></i>"; btn.setAttribute("aria-pressed", on);
 toast(on ? (WHO && WHO.kind === "brand" ? "Saved to your shortlist" : "Saved in this browser only · sign in as a brand to keep it") : "Removed");
}

/* ---------- filters ---------- */
function filtersHtml() {
  const v = k => esc(Q[k] || "");
  const sel = (k, opts) => `<select data-f="${k}"><option value="">Any</option>${opts.map(([val, t]) => `<option value="${val}" ${Q[k] === val ? "selected" : ""}>${t}</option>`).join("")}</select>`;
  const niches = new Set((Q.niche || "").split(",").filter(Boolean));
  return `<div class="stack">
    <div><label>Niche</label><div class="chips wrapx" style="flex-wrap:wrap">${NICHES.map(n => `<button type="button" data-niche="${n}" class="${niches.has(n) ? "on" : ""}">${n}</button>`).join("")}</div></div>
    <div><label>Platform</label>${sel("platform", [["instagram", "Instagram"], ["tiktok", "TikTok"], ["youtube", "YouTube"]])}</div>
    <div><label>Followers</label>${sel("tier", [["nano", "Nano (under 10K)"], ["micro", "Micro (10K–100K)"], ["mid", "Mid (100K–500K)"], ["macro", "Macro (500K–1M)"], ["mega", "Mega (over 1M)"]])}</div>
  <div class="row"><div class="grow"><label>Avg views from</label><input data-f="min_views" type="number" min="0" value="${v("min_views")}" placeholder="e.g. 20k"></div>
   <div class="grow"><label>to</label><input data-f="max_views" type="number" min="0" value="${v("max_views")}" placeholder="e.g. 100k"></div></div>
  <div><label>Minimum engagement rate (%)</label><input data-f="min_er" type="number" min="0" step="0.1" value="${v("min_er")}" placeholder="e.g. 2"></div>
    <div><label>Reel price up to ($): <b id="reel-out">${Q.max_reel ? "$" + Q.max_reel : "any"}</b></label>
      <input data-f="max_reel" type="range" min="100" max="2000" step="50" value="${Q.max_reel || 2000}">
      <p class="hint">Creators who keep prices private match by price band.</p></div>
    <div><label for="f-budget">Your budget per Reel ($)</label><input id="f-budget" data-f="budget" type="number" min="0" step="50" value="${v("budget")}" placeholder="e.g. 500">
      <p class="hint">Each card says if it fits. Private prices are never shown.</p></div>
    <div class="row"><div class="grow"><label>Audience in</label>${sel("country", [["UAE", "UAE"], ["KSA", "KSA"], ["GCC", "GCC"]])}</div>
   <div class="grow"><label>at least (%)</label><input data-f="min_country_pct" type="number" min="1" max="100" value="${v("min_country_pct")}" placeholder="e.g. 50"></div></div>
    <div class="row"><div class="grow"><label>Audience mostly</label>${sel("gender", [["female", "Women"], ["male", "Men"]])}</div>
      <div class="grow"><label>Age group</label>${sel("age", [["13-17", "13–17"], ["18-24", "18–24"], ["25-34", "25–34"], ["35-44", "35–44"], ["45+", "45+"]])}</div></div>
    <div><label>Language</label>${sel("language", [["English", "English"], ["Arabic", "Arabic"]])}</div>
    <div><label>Available by</label><input data-f="available_by" type="date" value="${v("available_by")}"></div>
  <div><label>Minimum completed Amend deals</label><input data-f="min_deals" type="number" min="0" value="${v("min_deals")}" placeholder="e.g. 1"></div>
    <label class="row" style="gap:8px;color:var(--ink)"><input type="checkbox" data-f="permit_valid" ${Q.permit_valid ? "checked" : ""} style="width:auto"> Valid UAE permit (format check)</label>
    <label class="row" style="gap:8px;color:var(--ink)"><input type="checkbox" data-f="hide_self_reported" ${Q.hide_self_reported ? "checked" : ""} style="width:auto"> Hide self-reported data</label>
    <button class="btn block" id="clear" type="button">Clear filters</button>
  </div>`;
}
function bindFilters(root) {
  $$("[data-niche]", root).forEach(b => b.onclick = () => {
    const s = new Set((Q.niche || "").split(",").filter(Boolean));
    s.has(b.dataset.niche) ? s.delete(b.dataset.niche) : s.add(b.dataset.niche);
    set("niche", [...s].join(",")); b.classList.toggle("on");
  });
  $$("[data-f]", root).forEach(el => {
    const ev = el.type === "range" ? "change" : el.tagName === "SELECT" || el.type === "checkbox" || el.type === "date" ? "change" : "input";
    el.addEventListener(ev, () => {
      let val = el.type === "checkbox" ? (el.checked ? "1" : "") : el.value;
      if (el.dataset.f === "max_reel" && +val >= 2000) val = "";
   if (el.dataset.f === "max_reel" && $("#reel-out")) $("#reel-out").textContent = val ? "$" + val : "any";
      set(el.dataset.f, val);
    });
  if (el.type === "range") el.addEventListener("input", () => { if ($("#reel-out")) $("#reel-out").textContent = +el.value >= 2000 ? "any" : "$" + el.value; });
  });
  $("#clear", root).onclick = () => { Q = {}; syncUrl(); drawFilters(); search(); closeSheet(); };
}
let tmr;
function set(k, v) { if (v) Q[k] = v; else delete Q[k]; clearTimeout(tmr); tmr = setTimeout(() => { PAGE = 0; syncUrl(); search(); }, 250); }
function syncUrl() { const s = new URLSearchParams(Q).toString(); history.replaceState({}, "", "/creators" + (s ? "?" + s : "")); }
function drawFilters() { $("#filters-side").innerHTML = `<h3>Filters</h3>` + filtersHtml(); bindFilters($("#filters-side")); }

/* ---------- results ---------- */
// Budget fit is worked out on the server from the creator's private price; only the verdict comes back.
function fitBadge(f) {
  const m = { fits: ["collected", "Fits your budget"], slightly_above: ["waiting", "Slightly above"], above: ["failed", "Above your budget"] }[f];
  return m ? ` <span class="pill ${m[0]}">${m[1]}</span>` : "";
}
function cardHtml(c) {
  return `<div class="card ccard">
    <div class="row"><div class="avatar">${initials(c.display_name)}</div>
      <div class="grow"><a href="/c/${esc(c.handle)}" class="cname"><b>${esc(c.display_name)}</b></a> <span class="muted small">@${esc(c.handle)}</span>
        <div class="tiny muted">${esc(c.city || "")}${c.country ? ", " + esc(c.country) : ""}${c.is_demo ? " · Demo data" : ""}</div></div>
   <button class="heart" data-short="${c.id}" aria-label="Shortlist" aria-pressed="${SHORT.has(c.id)}">${SHORT.has(c.id) ? "" : ""}</button></div>
    <div class="row wrapx" style="margin-top:8px;gap:6px">${c.niches.map(n => `<span class="pill">${esc(n)}</span>`).join("")}</div>
    <div class="stats">
      <div><b>${fmtN(c.followers)}</b><span>followers</span></div>
      <div><b>${fmtN(c.avg_views)}</b><span>avg views</span></div>
      <div><b>${c.engagement_rate != null ? c.engagement_rate + "%" : "–"}</b><span>engagement</span></div>
      <div><b>${c.top_country ? Math.round(c.top_country.pct) + "%" : "–"}</b><span>${c.top_country ? esc(c.top_country.name) : "audience"}</span></div>
    </div>
    ${c.ig ? `<p class="tiny muted ig-read" style="margin:-4px 0 8px">${esc(igReadLine(c.ig))}</p>` : ""}
    <div class="row between wrapx" style="gap:6px">
      <span>${c.reel_standard_cents ? `Reel from <b>${usd(c.reel_from_cents || c.reel_standard_cents)}</b>`
        : c.price && c.price.label ? `Reel <b>${esc(c.price.label)}</b>` : '<span class="muted small">No Reel price</span>'}${fitBadge(c.budget_fit)}</span>
      <span class="small">${c.rating ? `<i data-lucide='star' aria-hidden='true'></i> ${c.rating} (${c.reviews})` : '<span class="muted">No reviews yet</span>'}</span></div>
    <div class="row wrapx" style="gap:6px;margin-top:8px">${srcBadge(c.source)}${c.stale ? '<span class="pill failed">Data may be outdated</span>' : ""}
      <span class="pill ${c.permit.state === "ok" ? "collected" : c.permit.state === "soon" ? "waiting" : ""}">${c.permit.state === "ok" ? "Permit <i data-lucide='check' aria-hidden='true'></i>" : c.permit.state === "missing" ? "No permit" : "Permit: " + esc(c.permit.label)}</span></div>
    <div class="row" style="gap:8px;margin-top:10px">
      <button class="btn small primary grow" data-qv="${esc(c.handle)}" style="white-space:nowrap"><i data-lucide='panel-right-open' aria-hidden='true'></i> Quick view</button>
      <a class="btn small" href="/c/${esc(c.handle)}">Full page</a>
      <label class="btn small" style="gap:6px"><input type="checkbox" data-cmp="${c.id}" ${CMP.has(c.id) ? "checked" : ""} style="width:auto"> Compare</label></div>
  </div>`;
}
/* ---------- quick view drawer (Block 6) ---------- */
const SRC_LABEL = { verified: "Verified", instagram_read: "Instagram read (her connected account)", instagram_public: "From Instagram (public numbers), confirmed by the creator", insights_screenshot: "From an insights screenshot, not verified", demo: "Demo data", self_reported: "Self-reported" };
async function quickView(handle) {
  const sh = sheet(`<div class="skeleton"></div><div class="skeleton"></div>`, { drawer: true });
  let p;
  try { p = await api("/api/c/" + encodeURIComponent(handle)); }
  catch (e) { sh.innerHTML = `<div class="empty" role="alert"><p>${esc(friendlyError(e))}</p><button class="btn" id="qv-retry">Try again</button></div>`; $("#qv-retry").onclick = () => quickView(handle); return; }
  const brand = window.WHO && WHO.signed_in && WHO.kind === "brand";
  let lists = [];
  if (brand) { try { lists = (await api("/api/brand/shortlists")).lists; } catch {} }
  const tr = p.track_record || {};
  sh.innerHTML = `<div class="grab"></div><div class="row between"><div class="row"><div class="avatar">${initials(p.display_name)}</div>
      <div><h2 style="margin:0">${esc(p.display_name)}</h2><div class="small muted">@${esc(p.handle)}${p.city ? " · " + esc(p.city) : ""}${p.is_demo ? " · Demo data" : ""}</div></div></div>
      <button class="btn small ghost" onclick="closeSheet()" aria-label="Close"><i data-lucide='x' aria-hidden='true'></i></button></div>
    ${p.bio ? `<p>${esc(p.bio)}</p>` : ""}
    <div class="row wrapx" style="gap:6px">${(p.niches || []).map(n => `<span class="pill">${esc(n)}</span>`).join("")}</div>
    <h3 style="margin-top:16px">Reach</h3>
    ${(p.metrics || []).map(m => `<div class="stats"><div><b>${fmtN(m.followers)}</b><span>${esc(m.platform)} followers</span></div><div><b>${fmtN(m.avg_views)}</b><span>avg views</span></div>
      <div><b>${pct(m.engagement_rate)}</b><span>engagement</span></div></div><p class="tiny muted" style="margin-top:-4px">${m.ig ? esc(igReadLine(m.ig)) : `${esc(SRC_LABEL[m.source] || m.source)} · as of ${esc(m.as_of)}`}${m.stale ? " · may be outdated" : ""}</p>`).join("") || '<p class="small muted">No numbers shared yet.</p>'}
    <h3>Prices</h3><div class="list">${p.items.filter(i => i.standard_cents != null).slice(0, 6).map(i => `<div class="line"><div class="grow">${esc(i.name)}</div><div class="amt">${usd(i.standard_cents)}<div class="aed">${esc(i.aed)}</div></div></div>`).join("")}</div>
    <p class="small muted" style="margin-top:10px">On Amend: ${tr.completed || 0} deals completed${tr.rating ? ` · rating ${tr.rating} (${tr.reviews})` : ""}</p>
    ${brand && lists.length ? `<label for="qv-list">Add to a shortlist</label><div class="row" style="gap:8px"><select id="qv-list">${lists.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select>
      <button class="btn" id="qv-add">Add</button></div>` : ""}
    <div class="row" style="gap:8px;margin-top:16px"><a class="btn primary grow" href="/c/${esc(p.handle)}#request">Request a deal</a><a class="btn" href="/c/${esc(p.handle)}">Full profile</a></div>`;
  if ($("#qv-add")) $("#qv-add").onclick = e => busy(e.currentTarget, async () => {
    try { await api(`/api/brand/shortlists/${$("#qv-list").value}/items`, { body: { creator_id: p.id, on: true } }); toast("Added to list"); } catch (er) { toast(er.message, "bad"); } });
}
async function search(append = false) {
  if (!append) $("#results").innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;
  let r;
  try { r = await api("/api/creators?" + new URLSearchParams({ ...Q, page: PAGE }).toString()); }
  catch (e) { $("#results").innerHTML = `<div class="empty" role="alert">${esc(friendlyError(e))}<br><br><button class="btn" onclick="search()">Try again</button></div>`; return; }
 $("#count").textContent = `${r.total} creator${r.total === 1 ? "" : "s"}`;
  const html = r.creators.map(cardHtml).join("");
  if (append) $("#results").insertAdjacentHTML("beforeend", html);
  else $("#results").innerHTML = html || emptyHtml();
  if ($("#clear2")) $("#clear2").onclick = () => { Q = {}; syncUrl(); drawFilters(); search(); };
  if ($("#invite-go")) $("#invite-go").onclick = e => inviteCreator(e.currentTarget);
  if ($("#save-go")) $("#save-go").onclick = e => saveHandle(e.currentTarget);
  if ($("#ig-card")) igLookup($("#invite-go").dataset.handle);
  $("#more").innerHTML = r.more ? `<button class="btn block" id="lm">Load more</button>` : "";
  if (r.more) $("#lm").onclick = () => { PAGE++; search(true); };
 $$("[data-short]").forEach(b => b.onclick = () => toggleShort(b.dataset.short, b).catch(e => toast(e.message, "bad")));
  $$("[data-qv]").forEach(b => b.onclick = () => quickView(b.dataset.qv));
  $$("[data-cmp]").forEach(b => b.onchange = () => {
  if (b.checked && CMP.size >= 3) { b.checked = false; toast("Compare up to 3 creators", "bad"); return; }
    b.checked ? CMP.add(b.dataset.cmp) : CMP.delete(b.dataset.cmp); cmpBar();
  });
}
function cmpBar() {
  const bar = $("#cmpbar");
  bar.hidden = CMP.size < 2;
  bar.innerHTML = `<span>${CMP.size} selected</span><a class="btn primary small" href="/creators/compare?ids=${[...CMP].join(",")}">Compare ${CMP.size}</a>`;
}
async function browse() {
  $("#view").innerHTML = `
  <form class="card gold" id="ai-match" style="margin-bottom:14px"><label for="ai-text"><b>Describe your campaign</b></label>
    <textarea id="ai-text" maxlength="1000" style="min-height:64px" placeholder="e.g. Iced coffee launch in Dubai: food or coffee creators with a UAE audience, about $500 per Reel, starting next week."></textarea>
    <div class="row between wrapx" style="gap:8px;margin-top:8px"><span class="tiny muted">The AI only reads your words into criteria. Amend scores every creator the same way and shows why.</span>
      <button class="btn primary small" id="ai-go">Find matches</button></div></form>
  <div id="ai-out"></div>
  <div class="row" style="gap:8px"><input id="q" class="grow" placeholder="Search name, handle, niche or keyword" value="${esc(Q.q || "")}">
      <button class="btn small hide-desktop" id="openf">Filters</button></div>
    <div class="row between wrapx" style="margin:12px 0;gap:8px"><span class="muted small" id="count"></span>
      <div class="row" style="gap:6px"><label class="small muted" for="sort">Sort</label>
        <select id="sort" style="width:auto;padding:8px">${[["match", "Best match"], ["price", "Price: low to high"], ["views", "Average views"], ["engagement", "Engagement rate"], ["rating", "Rating"], ["newest", "Newest"]]
          .map(([k, t]) => `<option value="${k}" ${(Q.sort || "match") === k ? "selected" : ""}>${t}</option>`).join("")}</select>
        ${WHO && WHO.kind === "brand" ? `<button class="btn small" id="savesearch">Save search</button>` : ""}</div></div>
    <div id="results" class="cgrid"></div><div id="more" style="margin-top:12px"></div>`;
  let t; $("#q").oninput = e => { clearTimeout(t); t = setTimeout(() => set("q", e.target.value.trim()), 300); };
  $("#sort").onchange = e => set("sort", e.target.value === "match" ? "" : e.target.value);
  $("#openf").onclick = () => { const sh = sheet(`<h2>Filters</h2>` + filtersHtml() + `<button class="btn primary block" style="margin-top:12px" onclick="closeSheet()">Show results</button>`); bindFilters(sh); };
  if ($("#savesearch")) $("#savesearch").onclick = async () => {
  const name = prompt("Name this search", Q.niche ? Q.niche + " creators" : "My search"); if (!name) return;
  try { await api("/api/brand/searches", { body: { name, query: new URLSearchParams(Q).toString() } }); toast("Search saved · see Brand dashboard → Searches"); } catch (e) { toast(e.message, "bad"); }
  };
  $("#ai-match").onsubmit = e => { e.preventDefault(); aiMatch(); };
  drawFilters();
  await search();
}

/* ---------- empty results: say why, and offer to invite a handle that isn't on Amend ---------- */
const NOT_FILTERS = ["q", "sort", "page", "budget"];  // the budget only adds a badge; it never hides anyone
function filtersActive() { return Object.keys(Q).some(k => !NOT_FILTERS.includes(k) && Q[k]); }
function handleOf(text) {  // "@sara.eats" or "sara.eats": letters, digits, . and _ (an Instagram handle's shape)
  const m = /^@?([a-z0-9._]{1,30})$/i.exec((text || "").trim());
  return m && !/^[._]+$/.test(m[1]) && !m[1].includes("..") ? m[1].toLowerCase() : null;
}
function emptyHtml() {
  const icon = "<div class='ic'><i data-lucide='search' aria-hidden='true'></i></div>";
  if (filtersActive()) return `<div class="empty">${icon}<h2>No creators match these filters</h2><button class="btn primary" id="clear2">Clear filters</button></div>`;
  const h = handleOf(Q.q);
  if (h && !(window.WHO && WHO.kind === "brand")) return `<div class="empty" id="invite-box">${icon}<h2>Sign in as a brand to look up Instagram numbers</h2>
    <p class="small muted" style="max-width:440px;margin:0 auto 12px">No Amend profile has the handle @${esc(h)}. Brands can see a professional account's public Instagram numbers and invite the creator.</p>
    <a class="btn primary" id="brand-signin" href="/login?tab=brand&next=${encodeURIComponent(location.pathname + location.search)}">Sign in as a brand</a></div>`;
  if (h) return `<div class="empty" id="invite-box">${icon}<h2>@${esc(h)} isn't on Amend yet.</h2>
    <div id="ig-card"></div>
    <div class="row" style="gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" id="invite-go" data-handle="${esc(h)}">Invite them</button>
      <button class="btn" id="save-go" data-handle="${esc(h)}">Save to shortlist</button></div>
    <p class="small muted" id="ig-note" style="max-width:440px;margin:12px auto 0">The creator adds her own numbers and audience (age, city, gender) when she joins Amend.</p>
    <div id="invite-out"></div></div>`;
  return `<div class="empty">${icon}<h2>No creators found for “${esc(Q.q || "")}”</h2></div>`;
}
// Public Instagram numbers (Meta Business Discovery), for brands only. The server does the maths; errors come back as
// one of two plain messages, never raw. When the lookup is off, the card says so and Invite still works.
async function igLookup(handle) {
  const box = $("#ig-card");
  if (!(window.WHO && WHO.kind === "brand")) { box.innerHTML = ""; return; }
  box.innerHTML = `<div class="card ig-card" aria-busy="true"><div class="skeleton" style="width:50%"></div><div class="skeleton"></div></div>`;
  let r;
  try { r = await api(`/api/brand/ig-lookup?handle=${encodeURIComponent(handle)}`); }
  catch (e) { box.innerHTML = `<p class="small muted">${esc(friendlyError(e))}</p>`; return; }
  if (r.status !== "ok") { box.innerHTML = `<p class="small" style="margin:0 0 12px">${esc(r.message)}</p>`; return; }
  const n = r.numbers, num = v => v == null ? "–" : Number(v).toLocaleString("en-US");
  box.innerHTML = `<div class="card ig-card"><div class="small muted">Not on Amend yet: public Instagram numbers</div>
    <div class="row" style="gap:10px;margin:8px 0">${n.picture ? `<img src="${esc(n.picture)}" alt="" width="40" height="40" style="border-radius:50%">` : ""}
      <div style="text-align:left"><b>${esc(n.name || "@" + n.username)}</b><div class="tiny muted">@${esc(n.username)}</div></div></div>
    <div class="grid4 ig-stats">${[["Followers", num(n.followers)], ["Posts", num(n.posts)], ["Median likes", num(n.median_likes)],
      ["Median comments", num(n.median_comments)]].map(([k, v]) => `<div class="tile"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}</div>
    <p class="small" style="margin:8px 0 0">Engagement <b>${n.engagement_pct == null ? "–" : n.engagement_pct + "%"}</b> (median likes and comments of the last ${n.posts_used} posts ÷ followers)</p>
    ${n.disclosure ? `<p class="small" style="margin:4px 0 0"><b>${esc(n.disclosure.line)}</b> <span class="tiny muted">(tagged accounts found by code in the last ${n.disclosure.posts} captions)</span></p>` : ""}
    <p class="tiny muted" style="margin:4px 0 0">Fetched ${esc(fmtDate(r.fetched_at))}, ${esc(fmtTime(r.fetched_at))} from Instagram · Audience (age, city, gender): added when she joins Amend</p></div>`;
}
async function saveHandle(btn) {
  if (!(window.WHO && WHO.kind === "brand")) { location.href = `/login?tab=brand&next=${encodeURIComponent(location.pathname + location.search)}`; return; }
  await busy(btn, async () => {
    try { await api("/api/brand/invites", { body: { handle: btn.dataset.handle, save_only: true } }); toast("Saved: see Shortlists → Not on Amend yet"); }
    catch (e) { toast(friendlyError(e), "bad"); }
  });
}
async function inviteCreator(btn) {
  if (!(window.WHO && WHO.kind === "brand")) {  // the invite is tied to a brand account
    location.href = `/login?tab=brand&next=${encodeURIComponent(location.pathname + location.search)}`; return;
  }
  await busy(btn, async () => {
    try {
      const r = await api("/api/brand/invites", { body: { handle: btn.dataset.handle } });
      $("#invite-out").innerHTML = `<div class="card" style="margin-top:14px;text-align:left"><label for="inv-link">Claim link for @${esc(r.handle)} (expires ${esc(fmtDate(r.expires_at))})</label>
        <div class="row" style="gap:6px"><input id="inv-link" readonly value="${esc(r.link)}" onclick="this.select()">
          <button class="btn small" id="inv-copy">Copy link</button></div>
        <a class="btn small" style="margin-top:8px" href="${esc(r.whatsapp)}" target="_blank" rel="noopener">Share on WhatsApp</a>
        <p class="tiny muted" style="margin-top:6px">When @${esc(r.handle)} signs up with this link, you'll see “Joined” in Shortlists.</p></div>`;
      $("#inv-copy").onclick = async () => { try { await navigator.clipboard.writeText(r.link); toast("Link copied"); } catch { $("#inv-link").select(); toast("Select and copy the link"); } };
    } catch (e) { toast(friendlyError(e), "bad"); }
  });
}

/* ---------- AI match (Discovery v2, B): the AI reads criteria; code scores and explains ---------- */
async function aiMatch() {
  const text = $("#ai-text").value.trim();
  if (text.length < 10) { toast("Describe the campaign in a sentence or two", "bad"); return; }
  const out = $("#ai-out");
  out.innerHTML = `<div class="card" aria-busy="true"><div class="skeleton" style="width:40%"></div><div class="skeleton tall"></div></div>`;
  await busy($("#ai-go"), async () => {
    let r;
    try { r = await api("/api/discover/match", { body: { text } }); }
    catch (e) { out.innerHTML = `<div class="card" role="alert"><p class="small">${esc(friendlyError(e))}</p></div>`; return; }
    out.innerHTML = `<section class="card" style="margin-bottom:14px"><div class="row between wrapx" style="gap:8px"><h2 style="margin:0">Top ${r.creators.length} matches</h2>
        <button class="btn small ghost" id="ai-clear" type="button">Clear</button></div>
      <p class="small muted" style="margin:6px 0 4px">What we read from your words:</p>
      <div class="chips wrapx" style="flex-wrap:wrap">${r.criteria.map(c => `<button type="button" class="q-chip" data-quote="${esc(c.quote)}" title="Your words: ${esc(c.quote)}">${esc(c.label)}: <b>${esc(c.value)}</b></button>`).join("")}</div>
      <ol class="match-list">${r.creators.map((c, i) => `<li class="match-row"><span class="match-n">${i + 1}</span>
        <div class="grow"><div class="row between wrapx" style="gap:6px"><span><a href="/c/${esc(c.handle)}"><b>${esc(c.display_name)}</b></a> <span class="muted small">@${esc(c.handle)}</span>${c.is_demo ? ' <span class="tiny muted">· Demo data</span>' : ""}</span>
          <span class="pill held" title="Out of 100, same weights for every creator">${c.match.score}/100</span></div>
          <ul class="why">${c.match.why.map(w => `<li>${icon("check")} ${esc(w)}</li>`).join("")}${c.match.gaps.map(w => `<li class="gap">${icon("minus")} ${esc(w)}</li>`).join("")}</ul>
          <div class="small">${c.price && c.price.label ? `Reel ${esc(c.price.label)}` : ""}${fitBadge(c.budget_fit)}</div></div></li>`).join("")}</ol>
      <p class="tiny muted">Score weights: ${Object.entries(r.weights).map(([k, v]) => `${k.replace("_", " ")} ${v}`).join(" · ")}. Only what you asked for counts.</p></section>`;
    $("#ai-clear").onclick = () => { out.innerHTML = ""; };
    $$("[data-quote]", out).forEach(b => b.onclick = () => quoteSheet(b.dataset.quote, "Your campaign", "", ""));
  });
}

/* ---------- compare (S65) ---------- */
async function compare() {
 $("#ttl").textContent = "Compare creators";
  $("#filters-side").hidden = true;
  const ids = (new URLSearchParams(location.search).get("ids") || "").split(",").filter(Boolean).slice(0, 3);
  const r = await api("/api/creators/compare?ids=" + ids.join(","));
  if (!r.creators.length) { $("#view").innerHTML = `<div class="empty">Pick 2 or 3 creators to compare.<br><br><a class="btn primary" href="/creators">Find creators</a></div>`; return; }
  const C = r.creators;
  const m = c => c.metrics[0] || {};
  const aud = (c, g) => Object.entries((m(c).audience || {})[g] || {}).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${esc(k)} ${Math.round(v)}%`).join(", ") || "–";
  const price = (c, code) => { const p = c.items.find(i => i.code === code); return p && p.standard_cents ? usd(p.standard_cents) : "–"; };
  const rows = [
    ["Followers", c => fmtN(c.followers)], ["Platform", c => esc(c.platform || "–")], ["Avg views", c => fmtN(c.avg_views)],
    ["Engagement rate", c => c.engagement_rate != null ? c.engagement_rate + "%" : "–"], ["View rate", c => c.view_rate != null ? c.view_rate + "%" : "–"],
    ["Top countries", c => aud(c, "countries")], ["Gender", c => aud(c, "gender")], ["Ages", c => aud(c, "ages")],
    ["Data source", c => srcBadge(c.source) + (c.stale ? ' <span class="pill failed">outdated</span>' : "") + `<div class="tiny muted">as of ${esc(c.as_of || "–")}</div>`],
    ["Reel", c => price(c, "reel")], ["Story set", c => price(c, "story_set")], ["Extra revision", c => price(c, "extra_revision")],
    ["Usage rights / month", c => price(c, "usage_rights")], ["Exclusivity / month", c => price(c, "exclusivity")],
    ["Turnaround", c => c.turnaround_days != null ? c.turnaround_days + " days to first draft" : "–"],
    ["Next available", c => esc(fmtDate(c.next_available) || "–")], ["Languages", c => esc(c.languages.join(", ") || "–")],
    ["Permit", c => esc(c.permit.label)], ["Amend deals completed", c => c.track_record.completed],
    ["Rating", c => c.track_record.rating ? `<i data-lucide='star' aria-hidden='true'></i> ${c.track_record.rating} (${c.track_record.reviews})` : "No reviews yet"],
  ];
  $("#view").innerHTML = `<div class="cmp-wrap"><table class="cmp"><thead><tr><th></th>${C.map(c => `<th><div class="avatar" style="margin:0 auto 6px">${initials(c.display_name)}</div>
      <a href="/c/${esc(c.handle)}">${esc(c.display_name)}</a><div class="tiny muted">@${esc(c.handle)}</div></th>`).join("")}</tr></thead>
    <tbody>${rows.map(([label, f]) => `<tr><th scope="row">${label}</th>${C.map(c => `<td>${f(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="row wrapx" style="gap:8px;margin-top:14px">${C.map(c => `<a class="btn primary small" href="/c/${esc(c.handle)}#request">Request a deal with ${esc(c.display_name.split(" ")[0])}</a>`).join("")}</div>
    <p style="margin-top:14px"><a href="/creators">← Back to results</a></p>`;
}

(async () => {
  await loadShort();
  if (WHO && WHO.signed_in && WHO.kind === "brand") Shell.mount("brand", "discover", { title: COMPARE ? "Compare creators" : "Discover", name: WHO.name });
  COMPARE ? compare() : browse();
})();
</script>
