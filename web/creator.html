<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creator · Amend</title><meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0a0d13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css"><script src="/static/app.js"></script>
</head><body>
<header class="top"><a class="logo" href="/">Amend</a><span class="title" id="ttl"></span><span class="auth-slot"></span></header>
<main class="wrap" id="view"><div class="skeleton"></div><div class="skeleton"></div></main>
<script>
const handle = decodeURIComponent(location.pathname.split("/")[2] || "");
function unitText(p) { return { month: " / month", change: " per change", revision: " each" }[p.unit] || ""; }
function fmtN(n) { return n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n); }
function fmtMin(m) { return m < 60 ? Math.round(m) + " min" : m < 1440 ? Math.round(m / 60) + " h" : Math.round(m / 1440) + " d"; }
const SRC = { verified: "Verified (connected account)", insights_screenshot: "Read from an insights screenshot · checked by the creator, not verified", demo: "Demo data", self_reported: "Self-reported" };
function bars(obj) {
  const rows = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);
  return rows.length ? `<div class="bars">${rows.map(([k, v]) => `<div class="bar"><span>${esc(k)}</span><span class="track"><span class="fill" style="width:${Math.min(100, v)}%;display:block"></span></span><span>${Math.round(v)}%</span></div>`).join("")}</div>` : '<p class="muted small">Not shared</p>';
}
function metricsHtml(c) {
  if (!c.metrics || !c.metrics.length) return `<section class="card" style="margin-top:14px"><h2>Reach</h2><p class="muted small">No numbers shared yet.</p></section>`;
  return c.metrics.map(m => `<section class="card" style="margin-top:14px">
    <div class="row between"><h2 style="margin:0">${esc(m.platform[0].toUpperCase() + m.platform.slice(1))}</h2>
      <span class="tiny muted">Updated ${m.age_days === 0 ? "today" : m.age_days + " days ago"}</span></div>
    <p class="tiny muted" style="margin:4px 0 0">${esc(SRC[m.source] || m.source)}</p>
    ${m.stale ? '<div class="banner wait small" style="margin-top:8px">Data may be outdated (older than 60 days)</div>' : ""}
    <div class="stats"><div><b>${fmtN(m.followers)}</b><span>followers</span></div><div><b>${fmtN(m.avg_views)}</b><span>avg views</span></div>
      <div><b>${m.engagement_rate}%</b><span>engagement</span></div><div><b>${m.view_rate}%</b><span>view rate</span></div></div>
    <p class="hint">Engagement = (avg likes + avg comments) ÷ followers. View rate = avg views ÷ followers. Worked out by Amend.</p>
    <div class="row wrapx" style="gap:16px;align-items:flex-start">
      <div class="grow" style="min-width:150px"><h3>Countries</h3>${bars(m.audience.countries)}</div>
      <div class="grow" style="min-width:150px"><h3>Gender</h3>${bars(m.audience.gender)}</div>
      <div class="grow" style="min-width:150px"><h3>Ages</h3>${bars(m.audience.ages)}</div></div></section>`).join("");
}
// Amounts come pre-shaped by the server per the creator's price privacy (public: exact · range: her min–max or a band ·
// on request: no numbers). The page never works out a price itself.
function priceCard(p) {
  const pub = p.mode === "public";
  const range = pub && p.min_cents != null && p.max_cents != null && p.min_cents !== p.max_cents;
  const amt = pub ? (p.standard_cents == null ? '<span class="muted small">Terms</span>'
      : (range ? `${usd(p.min_cents)}–${usd(p.max_cents).slice(1)}` : usd(p.standard_cents)) + unitText(p) + (p.aed ? `<div class="aed">${p.aed}</div>` : ""))
    : `<span class="${p.mode === "on_request" ? "muted small" : ""}">${esc(p.label || "Price on request")}</span>${p.mode === "range" && p.label ? unitText(p) : ""}`;
  return `<div class="line"><div class="grow"><b>${esc(p.name)}</b>
      ${p.note ? `<div class="small muted">${esc(p.note)}</div>` : ""}</div><div class="amt">${amt}</div></div>`;
}
async function load() {
  let c;
  try { c = await api(`/api/c/${encodeURIComponent(handle)}`); }
  catch (e) {
    $("#view").innerHTML = e.status === 404
      ? `<div class="empty"><div class="ic"><i data-lucide='search' aria-hidden='true'></i></div><h2>No creator called @${esc(handle)}</h2><p><a href="/creators">Browse creators</a></p></div>`
      : `<div class="empty" role="alert"><div class="ic"><i data-lucide='wifi-off' aria-hidden='true'></i></div><h2>Couldn't load this profile</h2><p>${esc(friendlyError(e))}</p><button class="btn" id="retry">Try again</button></div>`;
    if ($("#retry")) $("#retry").onclick = load;
    return;
  }
  document.title = `${c.display_name} · Amend`;
 $("#ttl").textContent = "@" + c.handle;
  const main = c.items.filter(p => p.kind === "deliverable"), extras = c.items.filter(p => p.kind !== "deliverable");
  const permit = c.permit.state === "ok" ? `<span class="pill collected"><i data-lucide='circle-check' aria-hidden='true'></i> Permit ${esc(c.permit.label)}</span>`
    : `<span class="pill waiting">Permit: ${esc(c.permit.label)}</span>`;
  $("#view").innerHTML = `
    <div class="card"><div class="row"><div class="avatar lg">${initials(c.display_name)}</div>
      <div class="grow"><h1>${esc(c.display_name)}</h1><div class="muted">@${esc(c.handle)} · ${(c.followers || 0).toLocaleString()} followers</div></div></div>
      <p>${esc(c.bio || "")}</p><div class="small muted">${esc(c.audience || "")} · ${esc(c.niche || "")}</div>
      <div style="margin-top:10px">${permit}<div class="hint">Format and expiry check only. Not verified with the UAE Media Council.</div></div>
      <div class="row wrapx" style="gap:6px;margin-top:10px">${(c.niches || []).map(n => `<span class="pill">${esc(n)}</span>`).join("")}
        ${c.city ? `<span class="pill"><i data-lucide='map-pin' aria-hidden='true'></i> ${esc(c.city)}</span>` : ""}${(c.languages || []).map(l => `<span class="pill">${esc(l)}</span>`).join("")}
        ${c.is_demo ? '<span class="pill planned">Demo data</span>' : ""}</div></div>
    ${metricsHtml(c)}
    ${c.samples && c.samples.length ? `<section class="card" style="margin-top:14px"><h2>Samples</h2><div class="samples">${c.samples.map(s => `<div>${esc(s)}</div>`).join("")}</div>
      <p class="hint">Placeholders for demo creators.</p></section>` : ""}
    <section class="card" style="margin-top:14px"><h2>Availability</h2>
      <p class="small">${c.next_available ? `Next available <b>${esc(c.next_available)}</b>` : "Ask about dates"}${c.turnaround_days != null ? ` · first draft in about ${c.turnaround_days} days` : ""}</p>
      ${c.limits && c.limits.posting_days ? `<p class="small muted">Posts on ${c.limits.posting_days.map(d => d[0].toUpperCase() + d.slice(1)).join(", ")}</p>` : ""}</section>
    <section class="card" style="margin-top:14px"><h2>On Amend</h2>
      <div class="stats"><div><b>${c.track_record.completed}</b><span>deals done</span></div>
        <div><b>${c.track_record.on_time_pct != null ? c.track_record.on_time_pct + "%" : "–"}</b><span>on time</span></div>
        <div><b>${c.track_record.rating ? "<i data-lucide='star' aria-hidden='true'></i> " + c.track_record.rating : "–"}</b><span>${c.track_record.reviews} review${c.track_record.reviews === 1 ? "" : "s"}</span></div>
        <div><b>${c.track_record.median_reply_minutes != null ? fmtMin(c.track_record.median_reply_minutes) : "–"}</b><span>reply time</span></div></div>
      ${c.track_record.recent_reviews.map(r => `<blockquote class="small">${"<i data-lucide='star' aria-hidden='true'></i>".repeat(r.rating)}${"<i data-lucide='star' aria-hidden='true'></i>".repeat(5 - r.rating)} ${esc(r.text || "")}</blockquote>`).join("")}
      <p class="hint">Worked out from real deals on Amend, never typed in.</p>
      ${c.past_brands && c.past_brands.length ? `<p class="small muted">Past brands (self-reported): ${c.past_brands.map(esc).join(", ")}</p>` : ""}</section>
    <section class="card" style="margin-top:14px"><h2>Prices</h2><div class="list">${main.map(priceCard).join("") || '<div class="empty">No prices yet.</div>'}</div>
      ${extras.length ? `<details style="margin-top:8px"><summary class="muted">Extras & terms</summary><div class="list">${extras.map(priceCard).join("")}</div></details>` : ""}</section>
    <div class="card" style="margin-top:14px"><div class="icons3">
      <div><span class="ic"><i data-lucide='lock' aria-hidden='true'></i></span><span>Money held by PayPal</span></div>
      <div><span class="ic"><i data-lucide='handshake' aria-hidden='true'></i></span><span>Every change confirmed by both</span></div>
      <div><span class="ic"><i data-lucide='circle-check' aria-hidden='true'></i></span><span>Released only when the delivery matches the deal</span></div></div></div>
    <button class="btn primary block" style="margin-top:16px" id="req">Request a deal</button>`;
  $("#req").onclick = () => {
    const sh = sheet(`<h2>Request a deal with ${esc(c.display_name.split(" ")[0])}</h2>
      <p class="small muted">You'll get your own deal link. No account needed.</p>
      <form id="rq"><label>Brand name *</label><input name="brand_org" required maxlength="80">
        <label>Your name *</label><input name="contact_name" required maxlength="60">
        <label>Your email</label><input name="contact_email" type="email" maxlength="120">
        <div class="err" id="rq-err" hidden></div>
        <button class="btn primary block" id="rq-go" style="margin-top:16px">Start the deal</button></form>`);
    $("#rq", sh).onsubmit = e => {
      e.preventDefault();
      busy($("#rq-go"), async () => {
        try { const r = await api(`/api/c/${encodeURIComponent(handle)}/request`, { body: Object.fromEntries(new FormData(e.target)) }); location.href = r.go; }
    catch (er) { $("#rq-err").textContent = er.message; $("#rq-err").hidden = false; }
      });
    };
  };
}
load().then(() => { if (location.hash === "#request" && $("#req")) $("#req").click(); });
</script>
</body></html>
