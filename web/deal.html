<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal · Amend</title><meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0a0d13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css"><script src="/static/app.js"></script><script src="/static/chat.js"></script><script src="/static/work.js"></script><script src="/static/shell.js"></script>
</head><body class="dealroom">
<header class="top">
  <a class="back" id="back" href="/studio/deals" hidden>←</a><a class="logo" id="logo" href="/">Amend</a>
  <span class="title" id="ttl">Deal</span><span class="chip-me" id="me" hidden></span><span class="auth-slot"></span>
</header>
<div class="strip" id="strip" aria-busy="true"><span class="muted">Loading the deal…</span></div>
<div class="deal-grid wrap">
  <main id="view"><div aria-busy="true" aria-label="Loading the deal"><div class="card"><div class="skeleton" style="width:40%;height:18px;margin:8px 0"></div><div class="skeleton" style="width:90%;height:14px;margin:8px 0"></div><div class="skeleton" style="width:75%;height:14px;margin:8px 0"></div></div></div></main>
 <aside id="panel" class="panel-only" aria-label="Deal and money"></aside>
</div>
<script>
const parts = location.pathname.split("/");
const IS_BRAND = parts[1] === "d";
const KEY = IS_BRAND ? parts[2] : parts[3];
const Q = new URLSearchParams(location.search);
let V = null, lastBrief = "";

const url = (p = "") => IS_BRAND ? `/api/d/${KEY}${p}` : `/api/deals/${KEY}${p}`;

async function load() {
  if (!V) $("#view").innerHTML = skeletonHtml();  // first load: the page's shape, so nothing jumps when data arrives
  try { V = await api(url()); }
  catch (e) {
    if (!IS_BRAND && e.status === 401) { location.href = "/login"; return; }
    const kind = e.data && e.data.kind;
    if (kind || e.status === 404) {  // the link itself is the problem
      $("#view").innerHTML = `<div class="empty"><div class="ic">${kind === "expired" || kind === "revoked" ? "<i data-lucide='hourglass' aria-hidden='true'></i>" : "<i data-lucide='search' aria-hidden='true'></i>"}</div>
        <h2>${kind === "expired" ? "This deal link expired" : kind === "revoked" ? "This link was switched off" : "Link not found"}</h2>
        <p>Ask ${IS_BRAND ? "the creator" : "the brand"} for a new one.</p></div>`;
      return;
    }
    if (V) { toast(e.message, "bad"); return; }  // a refresh failed: keep what's on screen
    $("#view").innerHTML = `<div class="empty" role="alert"><div class="ic"><i data-lucide='wifi-off' aria-hidden='true'></i></div>
      <h2>Couldn't load this deal</h2><p>${esc(friendlyError(e))}</p>
      <button class="btn primary" id="retry-load">Try again</button></div>`;
    $("#retry-load").onclick = () => load();
    return;
  }
  render();
}
function skeletonHtml() {
  const bar = (w, h = 14) => `<div class="skeleton" style="width:${w};height:${h}px;margin:8px 0"></div>`;
  return `<div aria-busy="true" aria-label="Loading the deal"><div class="card">${bar("40%", 18)}${bar("90%")}${bar("75%")}${bar("60%")}</div>
    <div class="card" style="margin-top:12px">${bar("30%", 18)}${bar("100%", 64)}${bar("100%", 64)}</div></div>`;
}

function header() {
  const d = V.deal;
 $("#ttl").textContent = IS_BRAND ? `Deal with ${V.creator.name}` : `${d.brand_org}`;
  if (IS_BRAND && !document.body.classList.contains("app")) {  // the link's person is shown once
  $("#me").hidden = false; $("#me").textContent = `${V.me.name} · ${V.me.org}`;
    // the link already says who this is: offer to keep it as an account, not a second sign-in
    $$(".auth-slot").forEach(s => { s.dataset.fixed = "1";
      s.innerHTML = `<a class="btn small save-acct" href="/signup?kind=brand&next=${encodeURIComponent(location.pathname)}"><span class="lbl-long">Save your account</span><span class="lbl-short">Save account</span></a>`; });
  }
  const strip = $("#strip");
  strip.removeAttribute("aria-busy");
  if (d.status === "draft") {  // keep the strip (no jump), say where the deal is
    strip.hidden = false; strip.onclick = null;
    strip.innerHTML = `<span>New deal · <b>waiting for the brief</b></span>`;
  } else {
    strip.hidden = false;
    strip.innerHTML = `<span>${d.version ? "Version " + d.version : "Offer"} · <b>${V.price_hidden ? "price on request" : usd(V.total_cents)}</b></span>
      <span>${V.hold ? moneyPill(V.hold.status) : dealPill(d.status)} <span class="muted">▾</span></span>`;
    strip.onclick = dealSheet;
  }
}

function linesHtml(editable = false) {
  return `<div class="list">${V.terms.map(t => `
    <div class="line">
      <div class="grow"><b>${esc(t.name)}</b>${t.qty > 1 ? ` × ${t.qty}` : ""}
        ${editable && t.min_cents != null && t.max_cents != null && t.min_cents !== t.max_cents ? `
          <div class="row" style="margin-top:6px"><span class="small muted">$</span>
            <input class="price-in" data-term="${t.id}" type="number" min="${t.min_cents / 100}" max="${t.max_cents / 100}" step="1" value="${t.unit_cents / 100}" style="max-width:110px;padding:8px">
            <span class="small muted">standard ${usd(t.standard_cents)} · ${usd(t.min_cents)}–${usd(t.max_cents).slice(1)}</span></div>
          <div class="err" data-err="${t.id}" hidden></div>` : ""}
      </div>
      <div class="amt">${V.price_hidden ? '<span class="small muted">On request</span>' : `${usd(t.amount_cents)}<div class="aed">${t.aed}</div>`}</div>
   ${t.quote ? `<button class="q" title="Where this was agreed" data-quote="${esc(t.quote)}" aria-label="Show the exact words"><i data-lucide='quote' aria-hidden='true'></i></button>` : ""}
    </div>${offerHtml(t)}`).join("")}
    <div class="total"><span>Total</span><span>${V.price_hidden ? `<span class="small">${esc(V.creator.name.split(" ")[0])} confirms it when she accepts</span>` : `${usd(V.total_cents)} <span class="aed">· ${V.total_aed}</span>`}</span></div>${usageHtml()}</div>`;
}
// Price offers before acceptance (offers.py): the brand offers a different unit price on a line; the creator accepts,
// counters or declines; a counter goes back to the brand. Nothing is held until the deal is accepted.
function offerHtml(t) {
  if (!V.deal || V.deal.status !== "offered") return "";
  const o = (V.offers || []).filter(x => x.term_id === t.id)[0];
  const first = V.creator.name.split(" ")[0], brandName = (V.brand && V.brand.name || "The brand").split(" ")[0];
  const each = t.qty > 1 ? " each" : "";
  const note = x => x.note ? `<div class="small muted">“${esc(x.note)}”</div>` : "";
  const canOffer = IS_BRAND && V.me && V.me.role === "brand_main";
  const offerBtn = label => canOffer ? `<button class="btn small ghost" data-offer="${t.id}" data-name="${esc(t.name)}">${label}</button>` : "";
  let h = "";
  if (o && o.status === "open" && o.side === "brand") h = IS_BRAND
    ? `<div class="offer"><b>You offered ${usd(o.unit_cents)}</b>${each} · waiting for ${esc(first)}${note(o)}</div>`
    : `<div class="offer"><b>${esc(brandName)} offers ${usd(o.unit_cents)}</b>${each} (your price ${usd(t.unit_cents)})${note(o)}
        <div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn small primary" data-oa="accept" data-o="${o.id}">Accept</button>
        <button class="btn small" data-oc="${o.id}" data-name="${esc(t.name)}">Counter</button><button class="btn small ghost" data-oa="decline" data-o="${o.id}">Decline</button></div></div>`;
  else if (o && o.status === "open" && o.side === "creator") h = IS_BRAND
    ? `<div class="offer"><b>${esc(first)} counters ${usd(o.unit_cents)}</b>${each}${note(o)}
        ${canOffer ? `<div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap"><button class="btn small primary" data-oa="accept" data-o="${o.id}">Accept</button>
        <button class="btn small ghost" data-oa="decline" data-o="${o.id}">Decline</button>${offerBtn("Offer again")}</div>` : ""}</div>`
    : `<div class="offer"><b>You countered ${usd(o.unit_cents)}</b>${each} · waiting for ${esc(brandName)}${note(o)}</div>`;
  else if (o && o.status === "accepted") h = `<div class="offer ok small">${icon("circle-check")} Agreed at ${usd(o.unit_cents)}${each}</div>${offerBtn("Offer a different price")}`;
  else if (o && o.status === "declined") {
    const whose = o.side === "brand" ? (IS_BRAND ? "Your" : brandName + "'s") : (IS_BRAND ? first + "'s" : "Your");
    h = `<div class="offer small muted">${esc(whose)} offer of ${usd(o.unit_cents)} was declined</div>${offerBtn("Offer a different price")}`;
  } else h = offerBtn("Offer a different price");
  return h ? `<div class="offer-row">${h}</div>` : "";
}
function bindOffers() {
  const done = (v, msg) => { V = v; closeSheet(); render(); toast(msg); };
  $$("[data-offer]").forEach(b => b.onclick = () => priceSheet("Offer a different price", b.dataset.name, async (cents, note) =>
    done(await api(url("/offers"), { body: { term_id: b.dataset.offer, unit_cents: cents, note } }), `Offer sent to ${V.creator.name.split(" ")[0]}`)));
  $$("[data-oc]").forEach(b => b.onclick = () => priceSheet("Counter", b.dataset.name, async (cents, note) =>
    done(await api(url(`/offers/${b.dataset.oc}/counter`), { body: { unit_cents: cents, note } }), "Counter sent")));
  $$("[data-oa]").forEach(b => b.onclick = () => busy(b, async () => {
    try { done(await api(url(`/offers/${b.dataset.o}/${b.dataset.oa}`), { method: "POST" }), b.dataset.oa === "accept" ? "Price agreed" : "Declined"); }
    catch (e) { toast(e.message, "bad"); }
  }));
}
function priceSheet(title, name, send) {
  sheet(`<h2>${esc(title)}</h2><p class="small muted">${esc(name)} · price per item. Nothing is held until the deal is accepted.</p>
    <label for="of-amt">Price (USD)</label><input id="of-amt" type="number" min="1" step="1" inputmode="numeric" placeholder="e.g. 400">
    <label for="of-note">Short note (optional)</label><input id="of-note" maxlength="140" placeholder="e.g. Our launch budget is fixed">
    <div class="err" id="of-err" hidden></div><button class="btn primary block" id="of-go" style="margin-top:14px">Send</button>`);
  $("#of-go").onclick = e => busy(e.currentTarget, async () => {
    const cents = Math.round(+$("#of-amt").value * 100);
    if (!(cents > 0)) { $("#of-err").textContent = "Type a price above $0."; $("#of-err").hidden = false; return; }
    try { await send(cents, $("#of-note").value.trim()); }
    catch (er) { $("#of-err").textContent = er.message; $("#of-err").hidden = false; }
  });
}
function bindQuotes(root = document) {
  $$("[data-quote]", root).forEach(b => b.onclick = () => quoteSheet(b.dataset.quote, `${V.brand.name} (${V.brand.org})`, "the brief", ""));
}
/* ---------- brief fields (Phase 5): brand fills or accepts defaults; creator accepts or counters ---------- */
function briefHtml(editable) {
  const B = V.brief_fields || { fields: [] };
  if (!B.fields.length) return "";
  const side = IS_BRAND ? "brand" : "creator";
  const n = (B.acceptable || {})[side] || 0;
  const st = f => ({ agreed: '<span class="pill collected">Agreed</span>', countered: '<span class="pill waiting">Countered</span>',
    needs_brand: f.value ? '<span class="pill held">Suggested default</span>' : '<span class="pill failed">Not set</span>', pending: "" })[f.status] || "";
  return `<details class="card" style="margin-top:12px" ${editable ? "open" : ""}><summary><b>The brief</b> <span class="muted small">(${B.fields.length} fields)</span></summary>
    ${B.flags.map(x => `<div class="conflict"><i data-lucide='triangle-alert' aria-hidden='true'></i> ${esc(x)}</div>`).join("")}
    ${editable && n > 1 ? `<div class="row" style="justify-content:space-between;gap:8px;margin:8px 0">
      <span class="small muted">${side === "brand" ? `${n} fields use a suggested default` : `${n} fields to agree`}</span>
      <button class="btn small primary" id="brief-all" style="white-space:nowrap">${side === "brand" ? `Accept all ${n} suggested` : `Accept all ${n}`}</button></div>` : ""}
    <div class="list">${B.fields.map(f => `<div class="line" style="flex-wrap:wrap">
      <div class="grow" style="min-width:60%"><div class="small muted">${esc(f.label)} ${st(f)}</div>
        <div>${f.value ? esc(f.value) : '<span class="muted">—</span>'}</div>
        ${f.counter ? `<div class="small" style="margin-top:4px">↪ ${IS_BRAND ? "Creator's counter" : "Your counter"}: <b>${esc(f.counter.value)}</b>${f.counter.reason ? ` <span class="muted">(${esc(f.counter.reason)})</span>` : ""}</div>` : ""}
        ${f.source === "default" || f.status === "needs_brand" ? `<div class="tiny muted">Suggested by Amend because the brief didn't say</div>` : ""}</div>
      ${f.quote ? `<button class="q" data-quote="${esc(f.quote)}"><i data-lucide='quote' aria-hidden='true'></i></button>` : ""}
      ${editable ? `<div class="row" style="gap:6px;width:100%;justify-content:flex-end">${side === "brand"
        ? `${f.status === "countered" ? `<button class="btn small primary" data-fa="accept_counter" data-k="${f.key}">Accept counter</button>` : ""}
           ${f.status === "needs_brand" && f.value ? `<button class="btn small" data-fa="accept_default" data-k="${f.key}">Accept</button>` : ""}
           <button class="btn small" data-fa="edit" data-k="${f.key}">${f.value ? "Change" : "Fill in"}</button>`
        : `${f.status !== "agreed" && f.value ? `<button class="btn small" data-fa="accept" data-k="${f.key}">Accept</button>` : ""}
           <button class="btn small" data-fa="counter" data-k="${f.key}">Counter</button>`}</div>` : ""}
    </div>`).join("")}</div>
    ${!IS_BRAND && B.blockers.length ? `<div class="banner wait small" style="margin-top:8px">${B.blockers.map(esc).join("<br>")}</div>` : ""}</details>`;
}
function bindBrief() {
  const all = $("#brief-all");
  if (all) all.onclick = () => busy(all, async () => {
    try { V = await api(url("/brief/accept-all"), { body: {} }); render(); toast("All accepted"); }
    catch (e) { toast(e.message, "bad"); }
  });
  $$("[data-fa]").forEach(b => b.onclick = () => {
    const action = b.dataset.fa, key = b.dataset.k;
    let value = null, reason = null;
    if (action === "edit" || action === "counter") {
   value = prompt(action === "edit" ? "New value" : "Your counter (what you can do instead)");
      if (!value) return;
   if (action === "counter") reason = prompt("Reason (optional)") || null;
    }
    busy(b, async () => {
   try { V = await api(url(`/brief/fields/${key}`), { body: { action, value, reason } }); render(); toast("Saved"); }
   catch (e) { toast(e.message, "bad"); }
    });
  });
}

function extrasHtml() {
  const d = V.deal; let h = "";
  if (d.deadline) h += `<p class="small"><i data-lucide='calendar' aria-hidden='true'></i> Post: <b>${esc(fmtDate(d.deadline))}</b></p>`;
  if (d.done_means && d.done_means.length) h += `<p class="small muted" style="margin-bottom:4px">What done means</p><ul class="small" style="margin-top:0">${d.done_means.map(x => `<li>${esc(x.value)}</li>`).join("")}</ul>`;
  if (d.not_on_list && d.not_on_list.length) h += `<div class="banner wait small" style="margin-top:8px"><b>Not on ${esc(V.creator.name.split(" ")[0])}'s price list</b> (not priced):
    ${d.not_on_list.map(x => `<div>• ${esc(x.what)} <span class="muted">“${esc(x.quote)}”</span></div>`).join("")}</div>`;
  return h;
}
// PayPal honours a hold for 3 days; after that Amend renews it (once, any time before the 29-day expiry) right before
// collecting (delivery.execute_release). So a past "best collected by" date is never shown as advice.
function holdNote() {
  const h = V.hold, past = h.honor_until && new Date(h.honor_until) < new Date();
  if (!past) return `Hold expires ${dateStr(h.expires_at)}${h.honor_until ? ` · best collected by ${dateStr(h.honor_until)}` : ""}.`;
  return `Hold needs renewing before collecting. Amend renews it with PayPal automatically when the money is collected (allowed from day 4 of the hold, until ${dateStr(h.expires_at)}).`;
}
function dealSheet() {
  sheet(`<h2>The deal</h2>${linesHtml()}${extrasHtml()}
    ${V.hold && V.hold.expires_at ? `<p class="small muted">${holdNote()}</p>` : ""}
    <button class="btn block" onclick="closeSheet()">Close</button>`, { onOpen: sh => bindQuotes(sh) });
}

function render() {
  header();
  const d = V.deal;
  if (IS_BRAND && !V.me.confirmed_link) return welcomeSheet();
  if (IS_BRAND) brand(d); else creator(d);
  panel();
  bindBrief();
  bindQuotes();
  // bound here, after every view (active, cancelled…): a dispute can come after a cancellation too
  if ($("#send-proof")) $("#send-proof").onclick = e => {
    if (!confirm("Send this deal's record (the PDF from Download proof) to PayPal for the dispute? It's sent once.")) return;
    busy(e.currentTarget, async () => { try { V = await api(url("/dispute/evidence"), { body: {} }); render(); toast("Proof sent to PayPal"); } catch (er) { toast(friendlyError(er), "bad"); } });
  };
  // bound after panel(): the desktop copy of the usage line lives in the side panel, drawn after the room
  $$("[data-usage-extend]").forEach(b => b.onclick = () => busy(b, async () => {
    try { V = await api(url("/usage/extend"), { body: {} }); render(); toast("Extension card sent to the brand"); } catch (er) { toast(friendlyError(er), "bad"); } }));
  $$("[data-refund]").forEach(b => b.onclick = () => busy(b, async () => {
    try { V = await api(url(`/refunds/${b.dataset.refund}/approve`), { body: {} }); render(); toast("Refund sent through PayPal"); }
    catch (e) { toast(e.message, "bad"); }
  }));
  $$("[data-refund-no]").forEach(b => b.onclick = () => {
    const reason = prompt("Why are you declining? (the deal pauses until it's resolved)");
    if (reason === null) return;
    busy(b, async () => {
      try { V = await api(url(`/refunds/${b.dataset.refundNo}/decline`), { body: { reason } }); render(); toast("Declined · deal paused"); }
      catch (e) { toast(e.message, "bad"); }
    });
  });
 if (Q.get("held")) { toast("Held "); history.replaceState({}, "", location.pathname); }
  if (Q.get("pay_cancelled") || Q.get("pay_error")) {
  toast(Q.get("pay_error") === "paypal" ? "PayPal didn't answer. Nothing was charged." : "Payment not finished", "bad", () => $("#pay")?.click());
    history.replaceState({}, "", location.pathname);
  }
}

/* ---------- the active deal room: held money, the work, the chat (Phase 3+) ---------- */
function activeRoom(d) {
  const first = V.creator.name.split(" ")[0];
  const held = V.held_cents || 0;
  const pendingHolds = (V.extra_holds || []).filter(h => ["planned", "approved", "sent", "failed"].includes(h.status));
  const P = (() => { try { return JSON.parse(V.deal.pause_json || "{}"); } catch { return {}; } })();
  const pa = P.a || {}, pb = P.b || {};
  const banner = d.status === "paused" && P.kind === "creator_pause" ? `<div class="banner bad"><i data-lucide='circle-pause' aria-hidden='true'></i> Paused by ${esc(P.name || first)}: “${esc(P.quote || "")}” Money actions wait until ${IS_BRAND ? "she resumes" : "you resume"}; the chat stays open.
      ${!IS_BRAND ? `<div class="row" style="margin-top:6px"><button class="btn small primary" id="resume-deal">Resume the deal</button></div>` : ""}</div>`
    : d.status === "paused" ? `<div class="banner bad"><i data-lucide='circle-pause' aria-hidden='true'></i> Paused: different instructions from ${esc(pa.name || "")} and ${esc(pb.name || "")}. Money actions wait; the chat stays open.
      <blockquote class="small">${esc(pa.name || "")}: “${esc(pa.quote || "")}”</blockquote><blockquote class="small">${esc(pb.name || "")}: “${esc(pb.quote || "")}”</blockquote>
      ${IS_BRAND && V.me.role === "brand_main" ? `<div class="row" style="gap:8px"><button class="btn small" data-pick="a">Follow ${esc(pa.name || "A")}</button><button class="btn small" data-pick="b">Follow ${esc(pb.name || "B")}</button></div>` : ""}</div>`
    : d.status === "completed" ? `<div class="banner ok"><i data-lucide='circle-check' aria-hidden='true'></i> Completed</div>`
    : d.status === "delivered" ? `<div class="banner ok"><i data-lucide='package-check' aria-hidden='true'></i> Delivered${held ? ` · ${usd(held)} still held by PayPal` : " · the held money has been collected"}</div>`
    : `<div class="banner ok"><i data-lucide='wallet' aria-hidden='true'></i> ${usd(held)} held by PayPal · ${IS_BRAND ? esc(first) + " can start work" : "start work"}</div>`;
  $("#view").innerHTML = `${disputeBanner()}${banner}
    ${V.hold && V.hold.expires_at && held ? `<p class="small muted" style="margin-top:8px">${holdNote()} Nothing is collected until the delivery matches the deal.</p>` : ""}
    ${IS_BRAND && pendingHolds.length ? `<div class="banner gold" style="margin-top:10px">A confirmed change needs ${usd(pendingHolds.reduce((a, h) => a + h.amount_cents, 0))} more held.
      <button class="btn primary small" style="margin-left:8px" id="pay-extra">Pay with PayPal</button></div>` : ""}
    ${nextStepHtml(d, pendingHolds)}
    <div class="seg room-tabs hide-desktop" role="tablist" aria-label="Deal sections">${ROOM_TABS.map(([k, l, ic]) => `<button role="tab" data-rt="${k}" aria-selected="${k === ROOM_TAB}" class="${k === ROOM_TAB ? "on" : ""}">${icon(ic)}<span>${l}</span></button>`).join("")}</div>
    <div class="rt" data-tab="terms"><div class="card hide-desktop" style="margin-top:12px"><h2>The deal · Version ${d.version}</h2>${linesHtml()}${extrasHtml()}</div></div>
    <div class="rt" data-tab="money"><div class="hide-desktop" style="margin-top:12px">${moneyCardHtml()}<div class="spine-slot" style="margin-top:12px"></div></div></div>
    <div class="rt" data-tab="delivery">${shipHtml()}<div class="hide-desktop" style="margin-top:12px">${checklistHtml(d)}</div><div id="work" style="margin-top:12px"></div></div>
    <div class="rt" data-tab="chat"><div id="chat" style="margin-top:12px"></div><div id="cancelbox"></div></div>
    <div class="rt" data-tab="history"><div class="hide-desktop" style="margin-top:12px">${historyHtml()}${IS_BRAND ? alertsHtml() : ""}</div></div>
    <div class="row wrapx" style="margin-top:12px;gap:8px">
      ${IS_BRAND && V.me.role === "brand_main" ? `<button class="btn small" id="invite"><i data-lucide='users' aria-hidden='true'></i> Invite teammate</button>` : ""}
      ${!IS_BRAND ? `<a class="btn small" href="/api/deals/${KEY}/evidence.pdf" download><i data-lucide='file-check' aria-hidden='true'></i> Download proof</a>` : ""}

// What should happen next, and who does it. Worked out from the deal's status and money, never from the AI.
function nextStep(d, pendingHolds) {

  if (d.status === "completed") return { ic: "circle-check", t: "Done", s: "Every payment is in the ledger with the words behind it.", tab: "money" };
  if (d.status === "delivered" && !(V.held_cents || 0) && (V.money || []).some(i => i.kind === "capture" && i.status === "paid"))
    return { ic: "circle-check", t: "Money collected", s: IS_BRAND ? "Nothing more to do. Any holdback goes to the creator later, only if the post is still live." : "Any holdback is paid on its day if the post is still live.", tab: "money" };

    : { ic: "hourglass", t: "Waiting for the brand's sign-off", s: "Money is released once the delivery matches the latest confirmed deal.", tab: "delivery" };

    ? { ic: "eye", t: `Review ${first}'s draft`, s: "Approve it or ask for changes. The checks against the deal are under Delivery.", tab: "delivery" }
    : { ic: "hourglass", t: `Waiting for ${brandName}'s review`, s: "You'll see their answer here. Changes they ask for become a card you both confirm.", tab: "delivery" };
  if (d.status === "in_progress" && V.draft_status === "approved") return IS_BRAND
    ? { ic: "send", t: `Draft approved · ${first} posts next`, s: "Once it's live, the post check compares it with the deal.", tab: "delivery" }

    : { ic: "upload", t: "Send your draft", s: "Upload the draft or post link. The delivery check runs against the deal.", tab: "delivery" };
  return null;
}

let MDRAFT = null;

async function setupMandate() {

  const dl = V.deal.deadline && /^\d{4}-\d{2}-\d{2}/.test(V.deal.deadline) ? new Date(V.deal.deadline.slice(0, 10) + "T12:00:00Z") : new Date(Date.now() + 7 * 864e5);

  if (!ok) {

function mandateConditions() {
  if (!$("#mbox")) return [];
  const out = [];
  if ($("#m-x").checked) {
    const name = $("#m-item").selectedOptions[0]?.textContent || $("#m-item").value, max = Math.round(+$("#m-max").value * 100);

// Canonical JSON (sorted keys, no spaces), the same text Amend checks and hashes
function canon(o) {
  if (Array.isArray(o)) return "[" + o.map(canon).join(",") + "]";
  if (o && typeof o === "object") return "{" + Object.keys(o).sort().map(k => JSON.stringify(k) + ":" + canon(o[k])).join(",") + "}";
  return JSON.stringify(o);
}
function keyStore() {
  return new Promise((res, rej) => { const r = indexedDB.open("amend-keys", 1); r.onupgradeneeded = () => r.result.createObjectStore("keys");
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
}
async function brandKey() {
  const db = await keyStore();
  const get = () => new Promise(r => { const q = db.transaction("keys").objectStore("keys").get("ed25519"); q.onsuccess = () => r(q.result); q.onerror = () => r(null); });
  let kp = await get();
  if (!kp) {
    kp = await crypto.subtle.generateKey({ name: "Ed25519" }, false, ["sign", "verify"]);  // private key never leaves this device
    await new Promise(r => { const q = db.transaction("keys", "readwrite").objectStore("keys").put(kp, "ed25519"); q.onsuccess = r; q.onerror = r; });
  }
  return kp;
}
async function signMandate() {
  const conds = mandateConditions();
  const extra = conds.filter(c => c.type === "extra_item").reduce((a, c) => a + c.max_cents, 0);
  const m = { v: MDRAFT.v, type: MDRAFT.type, deal: MDRAFT.deal, creator: MDRAFT.creator, brand: MDRAFT.brand, scope: MDRAFT.scope,
    deal_cents: MDRAFT.deal_cents, cap_cents: MDRAFT.deal_cents + extra, expires_at: MDRAFT.expires_at, nonce: MDRAFT.nonce, conditions: conds };
  const body = canon(m), kp = await brandKey();
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const sig = b64(await crypto.subtle.sign({ name: "Ed25519" }, kp.privateKey, new TextEncoder().encode(body)));
  const pub = b64(await crypto.subtle.exportKey("raw", kp.publicKey));
  const r = await api(url("/mandate"), { body: { body, sig, pub } });
  toast(`Mandate signed · ${r.hash.slice(0, 12)}…`);
  return r;
}

  $("#mp-go").onclick = e => busy(e.currentTarget, async () => {
    const lines = items.map(p => ({ item_code: p.code, qty: +$(`[data-qty="${p.code}"]`, sh).value, quote: $(`[data-quote="${p.code}"]`, sh).value.trim() }))
      .filter(l => l.qty > 0);
  if (!lines.length) { $("#mp-err").textContent = "Pick at least one item"; $("#mp-err").hidden = false; return; }
    try { V = await api(url("/manual"), { body: { brief, lines } }); closeSheet(); render(); }
  catch (er) { $("#mp-err").textContent = er.message; $("#mp-err").hidden = false; }
  });
}

/* ---------- creator side (3.9) ---------- */
function creator(d) {
  const brandName = V.brand.name;
  if (d.status === "draft") {
    const l = (V.links || []).filter(x => !x.revoked).slice(-1)[0];
    $("#view").innerHTML = `<div class="banner wait"><i data-lucide='hourglass' aria-hidden='true'></i> Waiting for ${esc(d.brand_org)}'s brief</div>
      <div class="card" style="margin-top:12px"><h3>${esc(brandName)}'s link</h3>
        ${l ? `<input readonly value="${esc(l.url)}" onclick="this.select()"><p class="tiny muted">Expires ${dateStr(l.expires_at)} · ${l.opened_at ? "opened " + ago(l.opened_at) : "not opened yet"}</p>
        <div class="row"><button class="btn grow" id="cp">Copy link again</button><button class="btn danger grow" id="ex">Expire link</button></div>` : `<p class="muted">The link was switched off.</p>`}</div>`;
    if (l) {
   $("#cp").onclick = async () => { try { await navigator.clipboard.writeText(l.url); } catch {} toast("Copied"); };
   $("#ex").onclick = e => { if (confirm("Switch this link off? It stops working straight away.")) busy(e.currentTarget, async () => { await api(`/api/deal_links/${l.token}/expire`, { method: "POST" }); toast("Link switched off"); load(); }); };
    }
    return;
  }
  if (d.status === "offered") {
    $("#view").innerHTML = `
      <div class="banner gold"><i data-lucide='pen-line' aria-hidden='true'></i> ${esc(brandName)} sent a brief. Check the offer and accept.</div>
      <div class="card" style="margin-top:12px"><p class="small muted">The brief</p><blockquote class="small">${esc(d.brief || "")}</blockquote></div>
      <div class="card gold" style="margin-top:12px"><h2>Offer</h2>${linesHtml(true)}${extrasHtml()}</div>
      ${briefHtml(true)}
      <div class="stack" style="margin-top:14px">
        <button class="btn primary block" id="acc">Accept deal: version 1</button>
        <button class="btn block" id="ask">Ask for changes</button>
        <button class="btn danger block" id="dec">Decline</button></div>`;
    $$(".price-in").forEach(inp => inp.onchange = async () => {
      const err = $(`[data-err="${inp.dataset.term}"]`); err.hidden = true;
      const cents = Math.round(+inp.value * 100);
   if (cents < +inp.min * 100 || cents > +inp.max * 100) { err.textContent = `Must be between $${inp.min} and $${inp.max}`; err.hidden = false; $("#acc").disabled = true; return; }
   try { V = await api(url(`/terms/${inp.dataset.term}`), { method: "PUT", body: { unit_cents: cents } }); render(); toast("Price updated"); }
   catch (e) { err.textContent = e.message; err.hidden = false; $("#acc").disabled = true; }
    });
    $("#acc").onclick = () => {
      sheet(`<h2>Accept version 1?</h2><p>You'll start work once <b>${usd(V.total_cents)}</b> is held by PayPal.</p>
        <button class="btn primary block" id="acc2">Accept</button><button class="btn block" style="margin-top:8px" onclick="closeSheet()">Not yet</button>`);
      $("#acc2").onclick = e => busy(e.currentTarget, async () => {
    try { V = await api(url("/accept"), { method: "POST" }); closeSheet(); render(); toast("Accepted · version 1"); } catch (er) { toast(er.message, "bad"); }
      });
    };
    bindOffers();
    $("#ask").onclick = () => toast("Edit a price above (within your range), answer the brand's price offers on each line, or decline with a reason.");
    $("#dec").onclick = () => {
      sheet(`<h2>Decline this deal</h2><label>Reason (the brand sees this)</label><textarea id="why" maxlength="500"></textarea>
        <div class="err" id="why-err" hidden></div><button class="btn danger block" id="dec2" style="margin-top:12px">Decline</button>`);
      $("#dec2").onclick = e => busy(e.currentTarget, async () => {
        try { V = await api(url("/decline"), { body: { reason: $("#why").value } }); closeSheet(); render(); }
    catch (er) { $("#why-err").textContent = er.message; $("#why-err").hidden = false; }
      });
    };
    return;
  }
  if (d.status === "accepted") {
    const h = V.hold;
    $("#view").innerHTML = `
      <div class="banner wait"><i data-lucide='hourglass' aria-hidden='true'></i> <b>Work starts when money is held</b></div>
      <p class="small muted" style="margin-top:8px">${h && h.status === "sent" ? `${esc(brandName)} is at PayPal now.` : h && h.status === "expired" ? "The hold expired. The brand needs to hold again." : `Waiting for ${esc(brandName)} to hold ${usd(V.total_cents)} with PayPal.`}</p>
      <div class="card hide-desktop" style="margin-top:12px"><h2>Version ${d.version}</h2>${linesHtml()}${extrasHtml()}</div>`;
    return;
  }
  if (["in_progress", "delivered", "paused", "completed"].includes(d.status)) return activeRoom(d);
  if (d.status === "cancelled") {
    // a cancelled deal can still get a PayPal dispute (money was collected): show it, and keep the proof one tap away
    $("#view").innerHTML = `${disputeBanner()}<div class="banner bad">This deal was ${d.decline_reason ? "declined" : "cancelled"}.</div>
      ${d.decline_reason ? `<blockquote>${esc(d.decline_reason)}</blockquote>` : ""}
      <div class="row wrapx" style="margin-top:12px;gap:8px"><a class="btn small" href="/api/deals/${KEY}/evidence.pdf" download><i data-lucide='file-check' aria-hidden='true'></i> Download proof</a></div>`;
    return;
  }
  $("#view").innerHTML = `<div class="card">${dealPill(d.status)}${linesHtml()}</div>`;
}

(async () => {  // the app layout: always for the creator; for a brand only when signed in as a brand
  if (!IS_BRAND) Shell.mount("creator", "deals", { title: "Deal" });
  else { try { const w = await api("/api/whoami"); if (w.signed_in && w.kind === "brand") Shell.mount("brand", "deals", { title: "Deal", name: w.name }); } catch {} }
  if (!IS_BRAND) { try { const me = await api("/api/me"); Shell.setName(me.display_name.split(" ")[0]); } catch {} }
  load();
})();
</script>
</body></html>
