<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal · Amend</title><meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0a0d13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css"><script src="/static/app.js"></script><script src="/static/chat.js"></script><script src="/static/work.js"></script><script src="/static/shell.js"></script>
</head><body class="dealroom">
<header class="top">
  <a class="back" id="back" href="/studio/deals" hidden>←</a><a class="logo" id="logo" href="/">Amend</a>
  <span class="title" id="ttl">Deal</span><span class="chip-me" id="me" hidden></span><span class="auth-slot"></span>
</header>
<div class="strip" id="strip" hidden></div>
<div class="deal-grid wrap">
  <main id="view"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></main>
 <aside id="panel" class="panel-only" aria-label="Deal and money"></aside>
</div>
<script>
const parts = location.pathname.split("/");
const IS_BRAND = parts[1] === "d";
const KEY = IS_BRAND ? parts[2] : parts[3];
const Q = new URLSearchParams(location.search);
let V = null, lastBrief = "";

const url = (p = "") => IS_BRAND ? `/api/d/${KEY}${p}` : `/api/deals/${KEY}${p}`;

async function load() {
  try { V = await api(url()); }
  catch (e) {
    if (!IS_BRAND && e.status === 401) { location.href = "/login"; return; }
    const kind = e.data && e.data.kind;
    $("#view").innerHTML = `<div class="empty"><div class="ic">${kind === "expired" || kind === "revoked" ? "⌛" : "<i data-lucide='search' aria-hidden='true'></i>"}</div>
      <h2>${kind === "expired" ? "This deal link expired" : kind === "revoked" ? "This link was switched off" : "Link not found"}</h2>
      <p>${kind ? "Ask the creator for a new one." : esc(e.message)}</p></div>`;
    return;
  }
  render();
}

function header() {
  const d = V.deal;
 $("#ttl").textContent = IS_BRAND ? `Deal with ${V.creator.name}` : `${d.brand_org}`;
  if (IS_BRAND && !document.body.classList.contains("app")) {  // the link's person is shown once
  $("#me").hidden = false; $("#me").textContent = `${V.me.name} · ${V.me.org}`;
    $$(".auth-slot").forEach(s => s.hidden = true);
  }
  const strip = $("#strip");
  if (d.status !== "draft") {
    strip.hidden = false;
    strip.innerHTML = `<span>${d.version ? "Version " + d.version : "Draft"} · <b>${usd(V.total_cents)}</b></span>
      <span>${V.hold ? moneyPill(V.hold.status) : dealPill(d.status)} <span class="muted">▾</span></span>`;
    strip.onclick = dealSheet;
  }
}

function linesHtml(editable = false) {
  return `<div class="list">${V.terms.map(t => `
    <div class="line">
      <div class="grow"><b>${esc(t.name)}</b>${t.qty > 1 ? ` × ${t.qty}` : ""}
        ${editable && t.min_cents != null && t.max_cents != null && t.min_cents !== t.max_cents ? `
          <div class="row" style="margin-top:6px"><span class="small muted">$</span>
            <input class="price-in" data-term="${t.id}" type="number" min="${t.min_cents / 100}" max="${t.max_cents / 100}" step="1" value="${t.unit_cents / 100}" style="max-width:110px;padding:8px">
            <span class="small muted">standard ${usd(t.standard_cents)} · ${usd(t.min_cents)}–${usd(t.max_cents).slice(1)}</span></div>
          <div class="err" data-err="${t.id}" hidden></div>` : ""}
      </div>
      <div class="amt">${usd(t.amount_cents)}<div class="aed">${t.aed}</div></div>
   ${t.quote ? `<button class="q" title="Where this was agreed" data-quote="${esc(t.quote)}"></button>` : ""}
    </div>`).join("")}
    <div class="total"><span>Total</span><span>${usd(V.total_cents)} <span class="aed">· ${V.total_aed}</span></span></div></div>`;
}
function bindQuotes(root = document) {
  $$("[data-quote]", root).forEach(b => b.onclick = () => quoteSheet(b.dataset.quote, `${V.brand.name} (${V.brand.org})`, "the brief", ""));
}
/* ---------- brief fields (Phase 5): brand fills or accepts defaults; creator accepts or counters ---------- */
function briefHtml(editable) {
  const B = V.brief_fields || { fields: [] };
  if (!B.fields.length) return "";
  const side = IS_BRAND ? "brand" : "creator";
  const st = f => ({ agreed: '<span class="pill collected">Agreed</span>', countered: '<span class="pill waiting">Countered</span>',
    needs_brand: f.value ? '<span class="pill held">Suggested default</span>' : '<span class="pill failed">Not set</span>', pending: "" })[f.status] || "";
  return `<details class="card" style="margin-top:12px" ${editable ? "open" : ""}><summary><b>The brief</b> <span class="muted small">(${B.fields.length} fields)</span></summary>
    ${B.flags.map(x => `<div class="conflict"><i data-lucide='triangle-alert' aria-hidden='true'></i> ${esc(x)}</div>`).join("")}
    <div class="list">${B.fields.map(f => `<div class="line" style="flex-wrap:wrap">
      <div class="grow" style="min-width:60%"><div class="small muted">${esc(f.label)} ${st(f)}</div>
        <div>${f.value ? esc(f.value) : '<span class="muted">—</span>'}</div>
        ${f.counter ? `<div class="small" style="margin-top:4px">↪ ${IS_BRAND ? "Creator's counter" : "Your counter"}: <b>${esc(f.counter.value)}</b>${f.counter.reason ? ` <span class="muted">(${esc(f.counter.reason)})</span>` : ""}</div>` : ""}
        ${f.source === "default" || f.status === "needs_brand" ? `<div class="tiny muted">Suggested by Amend because the brief didn't say</div>` : ""}</div>
      ${f.quote ? `<button class="q" data-quote="${esc(f.quote)}"><i data-lucide='quote' aria-hidden='true'></i></button>` : ""}
      ${editable ? `<div class="row" style="gap:6px;width:100%;justify-content:flex-end">${side === "brand"
        ? `${f.status === "countered" ? `<button class="btn small primary" data-fa="accept_counter" data-k="${f.key}">Accept counter</button>` : ""}
           <button class="btn small" data-fa="edit" data-k="${f.key}">${f.value ? "Change" : "Fill in"}</button>`
        : `${f.status !== "agreed" && f.value ? `<button class="btn small" data-fa="accept" data-k="${f.key}">Accept</button>` : ""}
           <button class="btn small" data-fa="counter" data-k="${f.key}">Counter</button>`}</div>` : ""}
    </div>`).join("")}</div>
    ${!IS_BRAND && B.blockers.length ? `<div class="banner wait small" style="margin-top:8px">${B.blockers.map(esc).join("<br>")}</div>` : ""}</details>`;
}
function bindBrief() {
  $$("[data-fa]").forEach(b => b.onclick = () => {
    const action = b.dataset.fa, key = b.dataset.k;
    let value = null, reason = null;
    if (action === "edit" || action === "counter") {
   value = prompt(action === "edit" ? "New value" : "Your counter (what you can do instead)");
      if (!value) return;
   if (action === "counter") reason = prompt("Reason (optional)") || null;
    }
    busy(b, async () => {
   try { V = await api(url(`/brief/fields/${key}`), { body: { action, value, reason } }); render(); toast("Saved"); }
   catch (e) { toast(e.message, "bad"); }
    });
  });
}

function extrasHtml() {
  const d = V.deal; let h = "";
  if (d.deadline) h += `<p class="small"><i data-lucide='calendar' aria-hidden='true'></i> Post: <b>${esc(d.deadline)}</b></p>`;
  if (d.done_means && d.done_means.length) h += `<p class="small muted" style="margin-bottom:4px">What done means</p><ul class="small" style="margin-top:0">${d.done_means.map(x => `<li>${esc(x.value)}</li>`).join("")}</ul>`;
  if (d.not_on_list && d.not_on_list.length) h += `<div class="banner wait small" style="margin-top:8px"><b>Not on ${esc(V.creator.name.split(" ")[0])}'s price list</b> (not priced):
    ${d.not_on_list.map(x => `<div>• ${esc(x.what)} <span class="muted">“${esc(x.quote)}”</span></div>`).join("")}</div>`;
  return h;
}
function dealSheet() {
  sheet(`<h2>The deal</h2>${linesHtml()}${extrasHtml()}
    ${V.hold && V.hold.expires_at ? `<p class="small muted">Hold expires ${dateStr(V.hold.expires_at)}${V.hold.honor_until ? ` · best collected by ${dateStr(V.hold.honor_until)}` : ""}</p>` : ""}
    <button class="btn block" onclick="closeSheet()">Close</button>`, { onOpen: sh => bindQuotes(sh) });
}

function render() {
  header();
  const d = V.deal;
  if (IS_BRAND && !V.me.confirmed_link) return welcomeSheet();
  if (IS_BRAND) brand(d); else creator(d);
  panel();
  bindBrief();
  bindQuotes();
 if (Q.get("held")) { toast("Held "); history.replaceState({}, "", location.pathname); }
  if (Q.get("pay_cancelled") || Q.get("pay_error")) {
  toast(Q.get("pay_error") === "paypal" ? "PayPal didn't answer. Nothing was charged." : "Payment not finished", "bad", () => $("#pay")?.click());
    history.replaceState({}, "", location.pathname);
  }
}

/* ---------- the active deal room: held money, the work, the chat (Phase 3+) ---------- */
function activeRoom(d) {
  const first = V.creator.name.split(" ")[0];
  const held = V.held_cents || 0;
  const pendingHolds = (V.extra_holds || []).filter(h => ["planned", "approved", "sent", "failed"].includes(h.status));
  const P = (() => { try { return JSON.parse(V.deal.pause_json || "{}"); } catch { return {}; } })();
  const pa = P.a || {}, pb = P.b || {};
  const banner = d.status === "paused" ? `<div class="banner bad"><i data-lucide='circle-pause' aria-hidden='true'></i> Paused: different instructions from ${esc(pa.name || "")} and ${esc(pb.name || "")}. Money actions wait; the chat stays open.
      <blockquote class="small">${esc(pa.name || "")}: “${esc(pa.quote || "")}”</blockquote><blockquote class="small">${esc(pb.name || "")}: “${esc(pb.quote || "")}”</blockquote>
      ${IS_BRAND && V.me.role === "brand_main" ? `<div class="row" style="gap:8px"><button class="btn small" data-pick="a">Follow ${esc(pa.name || "A")}</button><button class="btn small" data-pick="b">Follow ${esc(pb.name || "B")}</button></div>` : ""}</div>`
    : d.status === "completed" ? `<div class="banner ok"><i data-lucide='circle-check' aria-hidden='true'></i> Completed</div>`
    : `<div class="banner ok"><i data-lucide='wallet' aria-hidden='true'></i> ${usd(held)} held by PayPal · ${IS_BRAND ? esc(first) + " can start work" : "start work"}</div>`;
  $("#view").innerHTML = `${banner}
    ${V.hold && V.hold.expires_at ? `<p class="small muted" style="margin-top:8px">Hold expires ${dateStr(V.hold.expires_at)}${V.hold.honor_until ? ` · best collected by ${dateStr(V.hold.honor_until)}` : ""}. Nothing is collected until the delivery matches the deal.</p>` : ""}
    ${IS_BRAND && pendingHolds.length ? `<div class="banner gold" style="margin-top:10px">A confirmed change needs ${usd(pendingHolds.reduce((a, h) => a + h.amount_cents, 0))} more held.
      <button class="btn primary small" style="margin-left:8px" id="pay-extra">Pay with PayPal</button></div>` : ""}
    <div class="card hide-desktop" style="margin-top:12px"><h2>The deal · Version ${d.version}</h2>${linesHtml()}${extrasHtml()}</div>
    ${shipHtml()}
    <div id="work" style="margin-top:12px"></div>
    <div id="chat" style="margin-top:12px"></div>
    <div id="cancelbox"></div>
    <div class="row wrapx" style="margin-top:12px;gap:8px">
      ${IS_BRAND && V.me.role === "brand_main" ? `<button class="btn small" id="invite"><i data-lucide='users' aria-hidden='true'></i> Invite teammate</button>` : ""}
      ${(IS_BRAND ? V.me.role === "brand_main" : true) && !["completed", "cancelled"].includes(d.status) ? `<button class="btn small danger" id="cancel-deal">Cancel deal…</button>` : ""}
      <button class="btn small" id="del-media">Delete my recordings and screenshots</button></div>`;
  Chat.mount($("#chat"), { base: url(""), isBrand: IS_BRAND, token: IS_BRAND ? KEY : "", onApplied: load });
  if ($("#pay-extra")) $("#pay-extra").onclick = e => busy(e.currentTarget, async () => {
    try { const r = await api(`/api/d/${KEY}/pay-hold/${pendingHolds[0].id}`, { method: "POST" }); location.href = r.approve_url; }
  catch (er) { toast(er.message, "bad"); }
  });
  if ($("#invite")) $("#invite").onclick = inviteSheet;
  bindShip();
 $$("[data-pick]").forEach(b => b.onclick = () => busy(b, async () => { try { V = await api(url("/pause/resolve"), { body: { pick: b.dataset.pick } }); render(); toast("Resumed"); } catch (e) { toast(e.message, "bad"); } }));
 if ($("#del-media")) $("#del-media").onclick = e => { if (confirm("Delete your voice notes, call transcripts, screenshots and files on this deal? A record that they were deleted stays.")) busy(e.currentTarget, async () => {
  const r = await api(url("/media/delete-mine"), { method: "POST" }); toast(`Deleted ${r.deleted} file${r.deleted === 1 ? "" : "s"}`); Chat.reload(); }); };
  if ($("#cancel-deal")) $("#cancel-deal").onclick = cancelSheet;
  cancelBox();
  if (typeof Work !== "undefined") Work.mount($("#work"), { V, IS_BRAND, url, reload: load });
}

/* ---------- cancellation with a fair split (Phase 7) ---------- */
async function cancelBox() {
  let r; try { r = await api(url("/cancel")); } catch { return; }
  const p = r.proposal; if (!p || !$("#cancelbox")) return;
  const s = p.split, o = p.second_opinion || {};
  const mine = IS_BRAND ? p.brand_ok : p.creator_ok;
  $("#cancelbox").innerHTML = `<div class="changecard" style="margin-top:12px"><b>Cancellation proposed</b> <span class="muted small">“${esc(p.reason || "")}”</span>
    <ul class="events" style="margin-top:8px">${s.evidence.map(e => `<li><span><i data-lucide='check' aria-hidden='true'></i></span><span class="grow">${esc(e.label)}</span><span class="tiny muted">${new Date(e.at).toLocaleString()}</span></li>`).join("")}</ul>
    <p class="small"><b>Work done: ${s.pct}%</b> (${esc(s.why)}${s.minimum_applied ? `, raised to the creator's ${s.minimum_pct}% minimum` : ""})</p>
    <div class="banner gold small">${esc(s.maths)}</div>
    <p class="small muted">Second opinion: ${o.available ? `${o.pct}% · ${esc(o.reason || "")} ${o.agrees ? "<i data-lucide='circle-check' aria-hidden='true'></i> agrees" : "<i data-lucide='triangle-alert' aria-hidden='true'></i> differs: both views are shown, you decide"}` : esc(o.note || "not available")}</p>
    <div class="tiny muted">Brand ${p.brand_ok ? "<i data-lucide='circle-check' aria-hidden='true'></i>" : "<i data-lucide='hourglass' aria-hidden='true'></i>"} · Creator ${p.creator_ok ? "<i data-lucide='circle-check' aria-hidden='true'></i>" : "<i data-lucide='hourglass' aria-hidden='true'></i>"}</div>
    ${mine ? "" : `<button class="btn primary block" id="cancel-ok" style="margin-top:8px">Approve: collect ${usd(s.creator_cents)}, release ${usd(s.brand_cents)}</button>`}</div>`;
 if ($("#cancel-ok")) $("#cancel-ok").onclick = e => busy(e.currentTarget, async () => { try { await api(url("/cancel/approve"), { method: "POST" }); toast("Approved"); load(); } catch (er) { toast(er.message, "bad"); } });
}
async function cancelSheet() {
 let r; try { r = await api(url("/cancel")); } catch (e) { toast(e.message, "bad"); return; }
  const s = r.preview;
  sheet(`<h2>Cancel this deal?</h2>${s ? `<p class="small">Based on the evidence so far: <b>${s.pct}%</b> of the work (${esc(s.why)}).</p><div class="banner gold small">${esc(s.maths)}</div>` : ""}
    <label>Reason (the other side sees this)</label><textarea id="cx-why" maxlength="300"></textarea>
    <button class="btn danger block" id="cx-go" style="margin-top:10px">Propose cancellation</button><p class="hint">Nothing moves until both of you approve.</p>`);
 $("#cx-go").onclick = e => busy(e.currentTarget, async () => { try { await api(url("/cancel"), { body: { reason: $("#cx-why").value } }); closeSheet(); toast("Proposed"); load(); } catch (er) { toast(er.message, "bad"); } });
}

/* ---------- product shipping (Phase 5.3) ---------- */
function hasProduct() {
  const f = (V.brief_fields && V.brief_fields.fields || []).find(x => x.key === "product");
  return f && f.value && !/^no product/i.test(f.value);
}
function shipHtml() {
  const s = V.shipment;
  if (!hasProduct() && !s) return "";
  if (!s) return IS_BRAND && V.me.role === "brand_main"
    ? `<div class="card" style="margin-top:12px"><h3>Ship the product</h3>
        <p class="small">${V.ship_to ? `Ship to: <b>${esc(V.ship_to)}</b>` : `${esc(V.creator.name.split(" ")[0])} hasn't added an address yet.`}</p>
    <div class="row" style="gap:8px"><input id="sh-courier" placeholder="Courier" class="grow"><input id="sh-track" placeholder="Tracking number" class="grow"></div>
        <label class="row" style="gap:8px;color:var(--ink)"><input type="checkbox" id="sh-hand" style="width:auto"> Hand delivery</label>
        <button class="btn primary block" id="sh-go" style="margin-top:8px">Save shipping</button>
        <p class="hint">The draft deadline starts when the creator marks the product received.</p></div>`
    : `<div class="card" style="margin-top:12px"><h3>Product</h3><p class="small muted">Waiting for the brand to ship it.${!IS_BRAND && !V.my_address ? " Add your address in Profile (it's shown to the brand only after the money is held)." : ""}</p></div>`;
  return `<div class="card" style="margin-top:12px"><h3>Product</h3>
    <p class="small">${s.hand_delivery ? "Hand delivery" : `${esc(s.courier || "")} · ${esc(s.tracking || "")}`}</p>
    ${s.received_at ? `<p class="small"><i data-lucide='circle-check' aria-hidden='true'></i> Received ${esc(s.received_at)} · draft due ${esc(V.deal.draft_due || "")}</p>`
      : (!IS_BRAND ? `<button class="btn primary block" id="sh-recv">Product received</button>` : `<p class="small muted">Waiting for ${esc(V.creator.name.split(" ")[0])} to confirm it arrived.</p>`)}</div>`;
}
function bindShip() {
  if ($("#sh-go")) $("#sh-go").onclick = e => busy(e.currentTarget, async () => {
  try { V = await api(url("/shipping"), { body: { courier: $("#sh-courier").value, tracking: $("#sh-track").value, hand_delivery: $("#sh-hand").checked } }); render(); toast("Shipping saved"); }
  catch (er) { toast(er.message, "bad"); }
  });
  if ($("#sh-recv")) $("#sh-recv").onclick = e => busy(e.currentTarget, async () => {
  try { V = await api(url("/received"), { method: "POST" }); render(); toast("Marked received · the draft clock starts today"); }
  catch (er) { toast(er.message, "bad"); }
  });
}

function inviteSheet() {
  const sh = sheet(`<h2>Invite a teammate</h2><p class="small muted">They get their own link. Unless you allow it, their messages are suggestions only and can't move money.</p>
  <form id="inv"><label>Name</label><input name="name" required maxlength="60" placeholder="Ali">
      <label>Role</label><select name="role"><option>Legal</option><option>Finance</option><option>Marketing</option><option>Other</option></select>
      <label class="row" style="gap:8px;color:var(--ink)"><input type="checkbox" name="can_confirm" style="width:auto"> Can confirm changes (moves money)</label>
      <button class="btn primary block" id="inv-go" style="margin-top:12px">Make their link</button></form><div id="inv-out"></div>`);
  $("#inv", sh).onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    busy($("#inv-go"), async () => {
      try {
        const r = await api(url("/invite"), { body: { name: f.get("name"), role: f.get("role"), can_confirm: !!f.get("can_confirm") } });
        $("#inv-out").innerHTML = `<label>Their link</label><input readonly value="${esc(r.link)}" onclick="this.select()">
          <button class="btn block" style="margin-top:8px" id="inv-cp">Copy link</button>`;
    $("#inv-cp").onclick = async () => { try { await navigator.clipboard.writeText(r.link); } catch {} toast("Copied"); };
   } catch (er) { toast(er.message, "bad"); }
    });
  };
}

/* ---------- desktop money panel (D5) ---------- */
const EVENT_TEXT = { "deal.created": "Deal link made", "link.created": "Link made", "link.opened": "Brand opened the link",
  "brief.submitted": "Brief sent", "brief.edited": "Brief edited", "deal.drafted": "Draft priced from the price list",
  "deal.accepted": "Accepted · version 1", "approval.recorded": "Hold approved by the brand", "money.approved": "Hold ready for PayPal",
  "paypal.called": "PayPal updated", "paypal.returned": "Back from PayPal", "money.status": "Money status changed",
  "term.price_edited": "Price edited", "deal.declined": "Declined", "deal.status": "Deal status changed", "money.planned": "Hold planned" };
function panel() {
  const h = V.hold;
  const ev = (V.events || []).filter(e => EVENT_TEXT[e.type] && e.type !== "fact.added").slice(-12).reverse();
  $("#panel").innerHTML = `
    <div class="card"><div class="row between"><h3>The deal</h3>${dealPill(V.deal.status)}</div>
      ${V.terms.length ? linesHtml() + extrasHtml() : `<p class="muted small">No lines yet. They appear when the brief is drafted.</p>`}</div>
    <div class="card" style="margin-top:14px"><div class="row between"><h3>Money</h3>${h ? moneyPill(h.status) : ""}</div>
      ${h ? `<p class="small">${usd(h.amount_cents)} <span class="aed">· ${aed(h.amount_cents)}</span></p>
        ${h.expires_at ? `<p class="small muted">Hold expires ${dateStr(h.expires_at)}${h.honor_until ? `<br>Best collected by ${dateStr(h.honor_until)}` : ""}</p>` : ""}
        ${h.authorization ? `<p class="tiny muted">PayPal authorisation ${esc(h.authorization)}</p>` : h.paypal_id ? `<p class="tiny muted">PayPal order ${esc(h.paypal_id)}</p>` : ""}`
        : `<p class="muted small">Nothing held yet. Money is held once the deal is accepted and the brand pays.</p>`}</div>
    <div class="card" style="margin-top:14px"><h3>History</h3>
      <ul class="events">${ev.map(e => `<li><span class="grow">${esc(EVENT_TEXT[e.type])}</span><span class="tiny muted">${ago(e.at)}</span></li>`).join("") || '<li class="muted">Nothing yet.</li>'}</ul></div>`;
  bindQuotes($("#panel"));
}

/* ---------- brand side (3.8) ---------- */
function welcomeSheet() {  // D3: who invited you and how it works, before the identity check
  $("#view").innerHTML = `<div class="empty"><div class="ic"></div>Welcome to your deal with ${esc(V.creator.name)}.</div>`;
  const first = V.creator.name.split(" ")[0];
  sheet(`<div class="row" style="margin-bottom:10px"><div class="avatar">${initials(V.creator.name)}</div>
      <div><h2 style="margin:0">${esc(V.creator.name)} invited you to a deal</h2><div class="muted small">@${esc(V.creator.handle)}</div></div></div>
    <ol class="steps compact">
      <li><span class="num">1</span><div><b>Tell ${esc(first)} what you need</b><p class="muted">The deal is priced from ${esc(first)}'s own price list.</p></div></li>
      <li><span class="num">2</span><div><b>Hold the money with PayPal</b><p class="muted">It's reserved, not taken. No Amend account needed.</p></div></li>
      <li><span class="num">3</span><div><b>Confirm changes together</b><p class="muted">Money moves only when you both confirm and the delivery matches.</p></div></li>
    </ol>
    <button class="btn primary block" id="welcome-go" style="margin-top:14px">Continue</button>`);
  $("#welcome-go").onclick = () => whoSheet();
}

function whoSheet() {
  $("#view").innerHTML = `<div class="empty"><div class="ic"></div>Confirm who you are to open this deal.</div>`;
  sheet(`<h2>This link is for <b>${esc(V.me.name)}</b> at ${esc(V.me.org)}.</h2><p>Is that you?</p>
    <div class="stack"><button class="btn primary block" id="yes">Yes, that's me</button><button class="btn block" id="no">No</button></div>
    <p class="hint">Every deal link belongs to one person. That's how Amend knows who said what.</p>`);
  $("#yes").onclick = e => busy(e.currentTarget, async () => { await api(url("/whoami"), { body: { is_me: true } }); closeSheet(); load(); });
  $("#no").onclick = e => busy(e.currentTarget, async () => {
    await api(url("/whoami"), { body: { is_me: false } });
    $("#sheet").innerHTML = `<div class="grab"></div><h2>This link is ${esc(V.me.name)}'s</h2>
      <p>Not ${esc(V.me.name)}? Ask ${esc(V.creator.name.split(" ")[0])} for your own link, or ask ${esc(V.me.name)} to invite you.</p>`;
  });
}

function brand(d) {
  const first = V.creator.name.split(" ")[0];
  if (d.status === "draft") {
    $("#view").innerHTML = `
      <div class="card"><div class="row"><div class="avatar">${initials(V.creator.name)}</div>
        <div class="grow"><b>${esc(V.creator.name)}</b> <span class="muted">@${esc(V.creator.handle)}</span>
        <div class="small muted">${(V.creator.followers || 0).toLocaleString()} followers · ${esc(V.creator.niche || "")}</div></div></div>
        <details style="margin-top:10px"><summary class="muted small">${esc(first)}'s price list</summary><div class="list">
          ${V.price_list.map(p => `<div class="line"><div class="grow">${esc(p.name)}${p.rules && p.rules.note ? `<div class="tiny muted">${esc(p.rules.note)}</div>` : ""}</div>
            <div class="amt small">${p.standard_cents == null ? "Terms" : usd(p.standard_cents)}</div></div>`).join("")}</div></details></div>
      <h2 style="margin-top:18px">What do you need?</h2>
      <div class="seg" style="margin-bottom:10px"><button type="button" data-mode="free" class="on">Type freely</button><button type="button" data-mode="form">Use the form</button></div>
      <div id="mode-free">
    <textarea id="brief" maxlength="2000" placeholder="e.g. 1 Reel showing our cold brew at home, plus 1 Story set. Post Friday 18:00–21:00. Mention 'new cold brew'. #ad. Organic repost only.">${esc(lastBrief)}</textarea>
        <div class="hint" id="cnt">0 / 2000</div></div>
      <form id="mode-form" hidden class="stack">
        ${V.price_list.filter(p => p.kind !== "rule").map(p => `<div class="row between"><span>${esc(p.name)} <span class="muted small">${usd(p.standard_cents)}${p.unit === "month" ? " / month" : ""}</span></span>
          <input type="number" min="0" max="10" value="0" data-qty="${esc(p.name)}" data-unit="${esc(p.unit)}" style="max-width:80px"></div>`).join("")}
        ${[["Objective", "objective", "e.g. Launch awareness for the new cold brew"], ["Main KPI", "kpi", "e.g. reach"], ["Audience", "audience", "e.g. coffee lovers in Dubai, 25–34"],
           ["Key messages (max 3)", "key_messages", "e.g. new cold brew; smooth; made in Dubai"], ["Must include", "must_include", "e.g. @duneroast #ad code DUNE10"],
           ["Posting date", "post_date", "e.g. Friday 13 Nov"], ["Posting time window", "posting_window", "e.g. 18:00–21:00"], ["Days live", "days_live", "e.g. 30"],
           ["Do's and don'ts", "dos_donts", ""], ["Disclosure", "disclosure", "e.g. #ad at the start"], ["Product to ship", "product", "e.g. 2 bottles of cold brew"],
           ["Usage rights", "usage_rights", "e.g. Organic repost only, or paid ads for 3 months"], ["Exclusivity", "exclusivity", "e.g. None, or no other coffee brands for 1 month"],
           ["Assets", "assets", "links to logo / brand guide"], ["Budget", "budget", "e.g. $600"]]
     .map(([l, k, ph]) => `<div><label>${l}</label><input data-k="${k}" data-l="${l}" maxlength="200" placeholder="${esc(ph)}"></div>`).join("")}
      </form>
      <div id="ai-state"></div>
      <button class="btn primary block" id="draft" style="margin-top:12px">Draft my deal</button>
      <p class="hint">Anything you leave out that a deal needs (posting window, usage rights, disclosure…) is flagged with a sensible default you can change.</p>`;
  const cnt = () => $("#cnt").textContent = `${$("#brief").value.length} / 2000`; cnt();
    $("#brief").oninput = cnt;
    $$("[data-mode]").forEach(b => b.onclick = () => { $$("[data-mode]").forEach(x => x.classList.toggle("on", x === b)); $("#mode-free").hidden = b.dataset.mode !== "free"; $("#mode-form").hidden = b.dataset.mode !== "form"; });
    $("#draft").onclick = e => {
      if (!$("#mode-form").hidden) {  // the form becomes plain sentences, so every line still has exact words behind it
        const parts = $$("[data-qty]").filter(i => +i.value > 0).map(i => `${i.value} ${i.dataset.qty}${i.dataset.unit === "month" ? " months" : ""}`);
        const rest = $$("[data-k]").filter(i => i.value.trim()).map(i => `${i.dataset.l}: ${i.value.trim()}.`);
        $("#brief").value = (parts.length ? parts.join(", ") + ". " : "") + rest.join(" ");
      }
      sendBrief(e.currentTarget, "POST");
    };
    return;
  }
  if (d.status === "offered") {
    $("#view").innerHTML = `
      <div class="card gold"><h2>Your draft deal</h2>${linesHtml()}${extrasHtml()}</div>
      ${briefHtml(V.me.role === "brand_main")}
      <div class="banner wait" style="margin-top:12px"><i data-lucide='hourglass' aria-hidden='true'></i> Waiting for ${esc(first)} to accept</div>
      <div class="stack" style="margin-top:12px"><button class="btn block" id="edit">Edit brief</button></div>
      <p class="hint">Prices come from ${esc(first)}'s own price list. The AI only picks the items; it never sets prices.</p>`;
    $("#edit").onclick = () => editBrief();
    return;
  }
  if (d.status === "accepted") {
    const h = V.hold;
    const expired = h && h.status === "expired";
    const waiting = h && h.status === "sent" && h.approve_url;
    $("#view").innerHTML = `
      <div class="banner ok">${esc(first)} accepted <i data-lucide='circle-check' aria-hidden='true'></i> · Version ${d.version}</div>
      <div class="card gold" style="margin-top:12px">
        <h2>${expired ? "Hold expired, hold again" : `Hold ${usd(V.total_cents)} with PayPal`}</h2>
        <p class="small">PayPal reserves the money. It is <b>not</b> taken now. It's collected only when the delivery matches this deal. If the deal is cancelled, the unused part is released.</p>
        <p class="small muted">A PayPal hold lasts up to 29 days (sandbox check, 7 Nov).</p>
        <button class="btn primary block" id="pay">${waiting ? "Continue at PayPal" : `Pay with PayPal: hold ${usd(V.total_cents)}`}</button>
      </div>
      <details class="card hide-desktop" style="margin-top:12px"><summary>See the deal</summary>${linesHtml()}${extrasHtml()}</details>
      ${briefHtml(false)}`;
    $("#pay").onclick = e => busy(e.currentTarget, async () => {
   try { const r = await api(url("/pay"), { method: "POST" }); if (r.approve_url) location.href = r.approve_url; else toast("PayPal didn't give a link. Try again.", "bad"); }
   catch (er) { toast(er.message, "bad", () => $("#pay").click()); }
    });
    return;
  }
  if (["in_progress", "delivered", "paused", "completed"].includes(d.status)) return activeRoom(d);
  if (d.status === "cancelled") {
    $("#view").innerHTML = `<div class="banner bad">This deal was ${d.decline_reason ? "declined" : "cancelled"}.</div>
      ${d.decline_reason ? `<div class="card" style="margin-top:12px"><p class="muted small">${esc(first)}'s reason</p><blockquote>${esc(d.decline_reason)}</blockquote></div>` : ""}`;
    return;
  }
  $("#view").innerHTML = `<div class="card">${dealPill(d.status)}${linesHtml()}</div>`;
}

function editBrief() {
  lastBrief = V.deal.brief || "";
  const sh = sheet(`<h2>Edit brief</h2><p class="small muted">A new draft is made. The old one is kept in the history.</p>
    <textarea id="brief2" maxlength="2000">${esc(lastBrief)}</textarea><div id="ai-state2"></div>
    <button class="btn primary block" id="redraft" style="margin-top:12px">Make a new draft</button>`);
  $("#redraft").onclick = e => sendBrief(e.currentTarget, "PUT", "#brief2", "#ai-state2");
}

async function sendBrief(btn, method, sel = "#brief", stateSel = "#ai-state") {
  const brief = $(sel).value.trim();
 if (brief.length < 5) { toast("Write a few words about what you need", "bad"); return; }
  lastBrief = brief;
  await busy(btn, async () => {
    $(stateSel).innerHTML = `<div class="card" style="margin-top:12px"><div class="small muted">Reading your brief… pricing from ${esc(V.creator.name.split(" ")[0])}'s list</div><div class="skeleton"></div><div class="skeleton"></div></div>`;
    try {
      const r = await api(url("/brief"), { method, body: { brief } });
      closeSheet(); V = r;
   if (r.ai && r.ai.fell_back) toast("Drafted with the backup model");
      render();
    } catch (e) {
      if (e.data && e.data.draft_failed) {
        $(stateSel).innerHTML = `<div class="banner bad" style="margin-top:12px">Couldn't draft it right now.</div>
          <div class="row" style="margin-top:8px"><button class="btn grow" id="again">Try again</button><button class="btn grow" id="manual">Write the items myself</button></div>`;
        $("#again").onclick = () => sendBrief(btn, method, sel, stateSel);
        $("#manual").onclick = () => manualPicker(brief);
   } else { $(stateSel).innerHTML = ""; toast(e.message, "bad"); }
    }
  });
}

function manualPicker(brief) {
  const items = V.price_list.filter(p => p.kind !== "rule");
  const sh = sheet(`<h2>Pick the items</h2><p class="small muted">Set a quantity, and copy the words from your brief that ask for it.</p>
    <blockquote class="small">${esc(brief)}</blockquote>
    ${items.map(p => `<div class="card" style="margin-top:8px"><div class="row between"><b>${esc(p.name)}</b><span>${usd(p.standard_cents)}</span></div>
      <div class="row" style="margin-top:6px"><input type="number" min="0" max="10" value="0" data-qty="${esc(p.code)}" style="max-width:80px">
   <input placeholder="exact words from your brief" data-quote="${esc(p.code)}" class="grow"></div></div>`).join("")}
    <div class="err" id="mp-err" hidden></div><button class="btn primary block" id="mp-go" style="margin-top:12px">Make the draft</button>`);
  $("#mp-go").onclick = e => busy(e.currentTarget, async () => {
    const lines = items.map(p => ({ item_code: p.code, qty: +$(`[data-qty="${p.code}"]`, sh).value, quote: $(`[data-quote="${p.code}"]`, sh).value.trim() }))
      .filter(l => l.qty > 0);
  if (!lines.length) { $("#mp-err").textContent = "Pick at least one item"; $("#mp-err").hidden = false; return; }
    try { V = await api(url("/manual"), { body: { brief, lines } }); closeSheet(); render(); }
  catch (er) { $("#mp-err").textContent = er.message; $("#mp-err").hidden = false; }
  });
}

/* ---------- creator side (3.9) ---------- */
function creator(d) {
  const brandName = V.brand.name;
  if (d.status === "draft") {
    const l = (V.links || []).filter(x => !x.revoked).slice(-1)[0];
    $("#view").innerHTML = `<div class="banner wait"><i data-lucide='hourglass' aria-hidden='true'></i> Waiting for ${esc(d.brand_org)}'s brief</div>
      <div class="card" style="margin-top:12px"><h3>${esc(brandName)}'s link</h3>
        ${l ? `<input readonly value="${esc(l.url)}" onclick="this.select()"><p class="tiny muted">Expires ${dateStr(l.expires_at)} · ${l.opened_at ? "opened " + ago(l.opened_at) : "not opened yet"}</p>
        <div class="row"><button class="btn grow" id="cp">Copy link again</button><button class="btn danger grow" id="ex">Expire link</button></div>` : `<p class="muted">The link was switched off.</p>`}</div>`;
    if (l) {
   $("#cp").onclick = async () => { try { await navigator.clipboard.writeText(l.url); } catch {} toast("Copied"); };
   $("#ex").onclick = e => { if (confirm("Switch this link off? It stops working straight away.")) busy(e.currentTarget, async () => { await api(`/api/deal_links/${l.token}/expire`, { method: "POST" }); toast("Link switched off"); load(); }); };
    }
    return;
  }
  if (d.status === "offered") {
    $("#view").innerHTML = `
      <div class="banner gold"><i data-lucide='pen-line' aria-hidden='true'></i> ${esc(brandName)} sent a brief. Check the draft and accept.</div>
      <div class="card" style="margin-top:12px"><p class="small muted">The brief</p><blockquote class="small">${esc(d.brief || "")}</blockquote></div>
      <div class="card gold" style="margin-top:12px"><h2>Draft deal</h2>${linesHtml(true)}${extrasHtml()}</div>
      ${briefHtml(true)}
      <div class="stack" style="margin-top:14px">
        <button class="btn primary block" id="acc">Accept deal: version 1</button>
        <button class="btn block" id="ask">Ask for changes</button>
        <button class="btn danger block" id="dec">Decline</button></div>`;
    $$(".price-in").forEach(inp => inp.onchange = async () => {
      const err = $(`[data-err="${inp.dataset.term}"]`); err.hidden = true;
      const cents = Math.round(+inp.value * 100);
   if (cents < +inp.min * 100 || cents > +inp.max * 100) { err.textContent = `Must be between $${inp.min} and $${inp.max}`; err.hidden = false; $("#acc").disabled = true; return; }
   try { V = await api(url(`/terms/${inp.dataset.term}`), { method: "PUT", body: { unit_cents: cents } }); render(); toast("Price updated"); }
   catch (e) { err.textContent = e.message; err.hidden = false; $("#acc").disabled = true; }
    });
    $("#acc").onclick = () => {
      sheet(`<h2>Accept version 1?</h2><p>You'll start work once <b>${usd(V.total_cents)}</b> is held by PayPal.</p>
        <button class="btn primary block" id="acc2">Accept</button><button class="btn block" style="margin-top:8px" onclick="closeSheet()">Not yet</button>`);
      $("#acc2").onclick = e => busy(e.currentTarget, async () => {
    try { V = await api(url("/accept"), { method: "POST" }); closeSheet(); render(); toast("Accepted · version 1"); } catch (er) { toast(er.message, "bad"); }
      });
    };
  $("#ask").onclick = () => toast("The deal chat for counter-offers opens on Sunday. For now, edit the prices above or decline with a reason.");
    $("#dec").onclick = () => {
      sheet(`<h2>Decline this deal</h2><label>Reason (the brand sees this)</label><textarea id="why" maxlength="500"></textarea>
        <div class="err" id="why-err" hidden></div><button class="btn danger block" id="dec2" style="margin-top:12px">Decline</button>`);
      $("#dec2").onclick = e => busy(e.currentTarget, async () => {
        try { V = await api(url("/decline"), { body: { reason: $("#why").value } }); closeSheet(); render(); }
    catch (er) { $("#why-err").textContent = er.message; $("#why-err").hidden = false; }
      });
    };
    return;
  }
  if (d.status === "accepted") {
    const h = V.hold;
    $("#view").innerHTML = `
      <div class="banner wait"><i data-lucide='hourglass' aria-hidden='true'></i> <b>Work starts when money is held</b></div>
      <p class="small muted" style="margin-top:8px">${h && h.status === "sent" ? `${esc(brandName)} is at PayPal now.` : h && h.status === "expired" ? "The hold expired. The brand needs to hold again." : `Waiting for ${esc(brandName)} to hold ${usd(V.total_cents)} with PayPal.`}</p>
      <div class="card hide-desktop" style="margin-top:12px"><h2>Version ${d.version}</h2>${linesHtml()}${extrasHtml()}</div>`;
    return;
  }
  if (["in_progress", "delivered", "paused", "completed"].includes(d.status)) return activeRoom(d);
  if (d.status === "cancelled") {
    $("#view").innerHTML = `<div class="banner bad">Declined.</div>${d.decline_reason ? `<blockquote>${esc(d.decline_reason)}</blockquote>` : ""}`;
    return;
  }
  $("#view").innerHTML = `<div class="card">${dealPill(d.status)}${linesHtml()}</div>`;
}

(async () => {  // the app layout: always for the creator; for a brand only when signed in as a brand
  if (!IS_BRAND) Shell.mount("creator", "deals", { title: "Deal" });
  else { try { const w = await api("/api/whoami"); if (w.signed_in && w.kind === "brand") Shell.mount("brand", "deals", { title: "Deal", name: w.name }); } catch {} }
  if (!IS_BRAND) { try { const me = await api("/api/me"); Shell.setName(me.display_name.split(" ")[0]); } catch {} }
  load();
})();
</script>
</body></html>
